<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · 双列快捷操作</title><link rel="stylesheet" href="review.css">
<template id="treatment"><style>
.ha-panel:not(.ha-expanded) { --ha-frame-radius: 16px; --ha-frame-shadow: 0 6px 20px -7px rgb(24 34 46 / 22%); }
.ha-panel .ha-welcome .ha-prompts {
  display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 5px;
}
.ha-panel .ha-welcome .ha-prompts h3 {
  grid-column: 1/-1; margin: 0 0 2px;
}
.ha-panel .ha-welcome .ha-prompts button {
  margin: 0; padding: 8px 10px; border-radius: 7px; min-height: 44px;
  gap: 7px; background: var(--surface-2); color: var(--text);
}
.ha-panel .ha-welcome .ha-prompts button:is(:hover,:focus-visible) { background: color-mix(in srgb,var(--surface-2) 90%,var(--text)); }
.ha-panel .ha-welcome .ha-prompts button:focus-visible { outline-offset: -3px; }
.ha-panel .ha-welcome .ha-prompts .ha-prompt-arrow { display: none; }
.ha-panel .ha-composer { border-radius: 10px; box-shadow: none; }
.ha-panel .ha-composer > textarea { min-height: 52px; }
.ha-panel .ha-composer:focus-within {
  border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent);
}
@container hub-assistant (max-width: 330px) {
  .ha-panel .ha-welcome .ha-prompts { grid-template-columns: 1fr; }
}
</style></template><script src="review.js" defer></script></html>
