          renderAll();
        };
      });
    }

    function renderMainTab() {
      const main = document.getElementById("m-main");
      if (state.activeTab === "search") renderSearchTab(main);
      else if (state.activeTab === "browse") renderBrowseTab(main);
      else if (state.activeTab === "agents") renderAgentsTab(main);
      else if (state.activeTab === "tasks") renderTasksTab(main);
      else if (state.activeTab === "review") renderReviewTab(main);
    }

    /* ========================================================================
       TAB 1: SEARCH (统一搜索 + 资料库范围半屏抽屉 + 今日脉搏)
       ======================================================================== */
    function getUnifiedSearchItems() {
      // Build a typed unified index across documents, journals, tasks, flashcards, and sessions
      const sourceDoc = id => DOCUMENTS.find(d => d.id === id);
      const docItems = DOCUMENTS.map(d => ({
        uid: `doc:${d.id}`,
        rawId: d.id,
        kind: d.type === "reading" ? "reading" : d.type === "journal" ? "journal" : "craft",
        typeBadge: d.typeLabel,
        libraryId: d.libraryId,
        folderId: d.folderId,
        sourceLine: `${d.libraryName} · ${d.folderPath}`,
        title: d.title,
        snippet: d.snippet,
        date: d.date,
        tags: d.tags
      }));

      const journalItems = JOURNALS.map(j => ({
        uid: `journal:${j.id}`,
        rawId: j.id,
        kind: "journal",
        typeBadge: "日志",
        libraryId: "obsidian",
        folderId: "os-daily",
        sourceLine: `日志 · ${j.receiptText}`,
        title: `${j.date} 速记 (${j.time})`,
        snippet: j.text,
        date: j.time,
        tags: j.tags
      }));

      const taskItems = TASKS.map(t => ({
        uid: `task:${t.id}`,
        rawId: t.id,
        kind: "task",
        typeBadge: t.done ? "任务 · 已完成" : `任务 · ${t.priority}`,
        libraryId: t.sourceType === "dida" ? "dida" : sourceDoc(t.docId)?.libraryId,
        folderId: t.sourceType === "dida" ? "dd-sprint" : sourceDoc(t.docId)?.folderId,
        sourceLine: t.sourceLabel,
        title: t.title,
        snippet: `截止：${t.due} · 来源快照关联文档可回跳`,
        date: t.due,
        tags: ["#任务闭环"]
      }));

      const cardItems = FLASHCARDS.map(c => ({
        uid: `card:${c.id}`,
        rawId: c.id,
        kind: "flashcard",
        typeBadge: "闪卡",
        libraryId: sourceDoc(c.docId)?.libraryId,
        folderId: sourceDoc(c.docId)?.folderId,
        sourceLine: `牌组：${c.deck}`,
        title: c.front,
        snippet: c.back.replace(/\n+/g, " "),
        date: "FSRS 待复习",
        tags: ["#闪卡复习"]
      }));

      if (state.searchType === "all" && !state.searchQuery.trim()) {
        // Default calm feed shows the 6 core indexed documents
        return docItems;
      }
      if (state.searchType === "craft") return docItems.filter(i => i.kind === "craft");
      if (state.searchType === "reading") return docItems.filter(i => i.kind === "reading");
      if (state.searchType === "journal") return [...docItems.filter(i => i.kind === "journal"), ...journalItems];
      if (state.searchType === "task") return taskItems;
      if (state.searchType === "flashcard") return cardItems;
      return [...docItems, ...journalItems, ...taskItems, ...cardItems];
    }

    function renderSearchTab(container) {
      const types = [
        { key: "all", label: "全部", count: DOCUMENTS.length + JOURNALS.length + TASKS.length + FLASHCARDS.length },
        { key: "craft", label: "资料", count: DOCUMENTS.filter(d => d.type === "craft" || d.type === "pdf").length },
        { key: "journal", label: "日志", count: JOURNALS.length + 1 },
        { key: "task", label: "任务", count: TASKS.length },
        { key: "reading", label: "阅读", count: DOCUMENTS.filter(d => d.type === "reading").length },
        { key: "flashcard", label: "闪卡", count: FLASHCARDS.length }
      ];

      const filteredDocs = getUnifiedSearchItems().filter(item => {
        if (state.selectedFolder) {
          if (item.libraryId !== state.selectedFolder.libId || item.folderId !== state.selectedFolder.folderId) return false;
        } else if (state.selectedLibIds !== null) {
          if (!state.selectedLibIds.includes(item.libraryId)) return false;
        }
        if (state.searchQuery.trim()) {
          const q = state.searchQuery.trim().toLowerCase();
          const hay = `${item.title} ${item.snippet} ${item.sourceLine} ${item.tags.join(" ")}`.toLowerCase();
          return hay.includes(q);
        }
        return true;

            <i data-lucide="sliders-horizontal" style="width:12px;height:12px;"></i>
            <span>${escapeHtml(getScopeSummaryLabel())}</span>
          </button>
        </div>

        <!-- Horizontal Content Type Chips -->
        <div class="m-chip-rail" role="tablist" aria-label="搜索内容类型">
          ${types.map(t => `
            <button type="button" class="m-chip ${state.searchType === t.key ? "is-active" : ""}" data-search-type="${t.key}">

        <!-- Active Scope Banner (When Filtered) -->
        ${isScopeFiltered() ? `

            <div style="display:flex;align-items:center;gap:6px;min-width:0;">
              <i data-lucide="filter" style="width:13px;height:13px;flex-shrink:0;"></i>
              <span class="m-truncate">范围：<strong>${escapeHtml(getScopeSummaryLabel())}</strong>（仅限本地检索，不向 AI 上传整库）</span>
            </div>
            <button type="button" id="btn-reset-scope" style="background:none;border:none;color:var(--m-accent-ink);font-weight:700;font-size:11.5px;cursor:pointer;white-space:nowrap;">

        ${!state.searchQuery.trim() ? `

            </button>
            <button type="button" class="m-pulse-card" id="pulse-go-insights">
              <span class="m-pulse-num" style="color:var(--m-green);">2</span>
              <span class="m-pulse-label"><i data-lucide="sparkles" style="width:12px;height:12px;"></i>新洞察发现</span>
            </button>
          </div>

          <!-- Suggested Search Keywords -->
          <div class="m-section" style="margin-top:14px;">
            <div class="m-section-header">
              <span class="m-section-title">试试搜索 · 跨库高频主题</span>
              <button type="button" class="m-section-action" id="btn-search-go-libs">浏览资料库目录 →</button>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${["混合检索", "VPS", "三阶段", "Liquid Glass", "P99", "LongMemEval"].map(kw => `
                <button type="button" class="m-chip" data-suggest-kw="${kw}" style="height:27px;font-size:11.5px;">
                  <i data-lucide="trending-up" style="width:11px;height:11px;color:var(--m-ink-3);"></i>
                  <span>${kw}</span>
                </button>
              `).join("")}
            </div>
          </div>
        ` : ""}

        <!-- Search Results Stream -->
        <div class="m-section" style="margin-top:12px;">
          <div class="m-section-header">
            <span class="m-section-title">${state.searchQuery.trim() ? `检索结果 (${filteredDocs.length})` : `最近更新与命中 (${filteredDocs.length})`}</span>
            <span style="font-size:11px;color:var(--m-ink-3);font-family:var(--m-font-mono);">FTS5 · 14ms</span>
          </div>

          ${filteredDocs.length === 0 ? `
            <div class="m-card m-card-padded" style="text-align:center;padding:28px 16px;">

              </div>
            </article>
          `).join("")}
        </div>
      `;

      // Bind events
      const input = document.getElementById("m-search-input");
      input.oninput = (e) => {
        state.searchQuery = e.target.value;
        const pos = e.target.selectionStart;
        renderMainTab();
        if (window.lucide) window.lucide.createIcons();

          nextInput.focus();

      const clearBtn = document.getElementById("btn-clear-search");
      if (clearBtn) {
        clearBtn.onclick = () => {
          state.searchQuery = "";
          renderAll();
        };

      document.getElementById("btn-open-scope-sheet").onclick = () => openScopeFilterSheet();

      const resetBtn = document.getElementById("btn-reset-scope") || document.getElementById("btn-empty-reset-scope");
      if (resetBtn) {
        resetBtn.onclick = () => {
          state.selectedLibIds = null;

      container.querySelectorAll("[data-search-type]").forEach(btn => {
        btn.onclick = () => {

      container.querySelectorAll("[data-suggest-kw]").forEach(btn => {
        btn.onclick = () => {

        };
      });

      const pulseReview = document.getElementById("pulse-go-review");
      if (pulseReview) pulseReview.onclick = () => { state.activeTab = "review"; state.reviewDeck = ""; state.cardFlipped = false; state.reviewSubTab = "today"; renderAll(); };
      const pulseTasks = document.getElementById("pulse-go-tasks");
      if (pulseTasks) pulseTasks.onclick = () => { state.activeTab = "tasks"; renderAll(); };
      const pulseInsights = document.getElementById("pulse-go-insights");

      const goLibs = document.getElementById("btn-search-go-libs");

      container.querySelectorAll("[data-open-unified]").forEach(card => {
        card.onkeydown = event => { if (["Enter", " "].includes(event.key)) { event.preventDefault(); card.click(); } };
        card.onclick = () => {

          const target = { doc: "doc-detail", task: "task-detail", card: "card-detail", journal: "journal-detail" }[kind];
          if (target) openPushView(target, id);
        };
      });
    }

    function getDocKb(doc) {
      return ((doc.title.length + doc.snippet.length + doc.content.join("").length) * 0.032 + 4.8).toFixed(1);
    }

    function autoRecallDocsForPrompt(promptText) {
      const q = (promptText || "").toLowerCase();
      const scored = DOCUMENTS.map(d => {
        let s = 0;
        const hay = `${d.title} ${d.snippet} ${d.libraryName} ${d.tags.join(" ")}`.toLowerCase();
        if (q.includes("检索") && hay.includes("检索")) s += 5;
        if (q.includes("vps") && hay.includes("vps")) s += 5;
        if (q.includes("速记") || q.includes("同步")) { if (d.id === "doc-3") s += 5; }
        if (q.includes("压测") || q.includes("飞书") || q.includes("p99")) { if (d.id === "doc-4") s += 6; }
        if (q.includes("记忆") || q.includes("论文")) { if (d.id === "doc-6") s += 6; }
        for (const ch of q.split(/\s+/)) {
          if (ch.length >= 2 && hay.includes(ch)) s += 2;
        }
        return { doc: d, score: s };
      }).sort((a, b) => b.score - a.score);
      const top = scored.filter(x => x.score > 0).slice(0, 2).map(x => x.doc);
      return top.length ? top : [DOCUMENTS[0], DOCUMENTS[3]];
    }

        toggleHandoff.onclick = () => {
          state.handoffExpanded = !state.handoffExpanded;
          renderAll();
        };
      }

      const handoffCacheBtn = document.getElementById("btn-handoff-cache");
      if (handoffCacheBtn) {
        handoffCacheBtn.onclick = () => {
          state.handoffCached = true;
          showToast("已缓存桌面接力报告与图表副本（SHA-256 校验通过）");
          renderAll();
        };
      }

      const handoffAskBtn = document.getElementById("btn-handoff-ask");
      if (handoffAskBtn) {
        handoffAskBtn.onclick = () => {
          const input = document.getElementById("input-agent-prompt");
          if (input) {
            state.promptDraft = input.value = "基于桌面接力的《Q4 检索压测报告》，移动端单文件夹裁剪还能怎么优化？";
            input.focus();
          }
        };
      }

      const clearSkillBtn = document.getElementById("btn-clear-skill");
      if (clearSkillBtn) {
        clearSkillBtn.onclick = () => {
          state.activeSkill = null;
          renderAll();
        };
      }

      container.querySelectorAll("[data-toggle-cot]").forEach(btn => {
        btn.onclick = () => {
          const msgId = btn.getAttribute("data-toggle-cot");
          state.cotExpandedMap[msgId] = !state.cotExpandedMap[msgId];
          renderAll();
        };
      });

      container.querySelectorAll("[data-cite-doc]").forEach(btn => {
        btn.onclick = () => openPushView("doc-detail", btn.getAttribute("data-cite-doc"));
      });

      // 1-Tap Inline Save to Journal Receipt (First click saves immediately and turns green; second click opens Journal view)
      container.querySelectorAll("[data-agent-save-note]").forEach(btn => {
        btn.onclick = () => {
          const msgId = btn.getAttribute("data-agent-save-note");
          if (state.savedNoteMsgIds[msgId]) {
            openPushView("journal-detail", state.savedNoteMsgIds[msgId]);
            return;
          }
          const msg = state.agentMessages.find(m => m.id === msgId);
          state.savedNoteMsgIds[msgId] = crypto.randomUUID();
          JOURNALS.unshift({
            id: state.savedNoteMsgIds[msgId],
            date: localDay(),
            time: "刚刚",
            receipt: "local",
            receiptText: "已存本机 · 待上传",
            tags: ["#VPS助手成果", "#架构思考"],
            text: `【VPS Codex 归纳】${msg ? msg.text.replace(/\*\*/g, "") : ""}`,
            voice: null,
            attachments: []
          });
          showToast("✓ 已一键存至今日日志并入列 OSS（再次点击可直达查看）");
          renderAll();
        };
      });

      // 1-Tap Inline Convert to Task Receipt (First click creates task and turns green; second click jumps to Tasks tab)
      container.querySelectorAll("[data-agent-to-task]").forEach(btn => {
        btn.onclick = () => {
          const msgId = btn.getAttribute("data-agent-to-task");
          if (state.convertedTaskMsgIds[msgId]) {
            openPushView("task-detail", state.convertedTaskMsgIds[msgId]);
            return;
          }
          state.convertedTaskMsgIds[msgId] = crypto.randomUUID();
          const message = state.agentMessages.find(m => m.id === msgId);
          TASKS.unshift({
            id: state.convertedTaskMsgIds[msgId],
            title: "跟进：" + (message?.text || activeSess.title).replace(/\*/g, "").slice(0, 54),
            done: false,
            due: "今天",
            priority: "高优",
            sourceType: "agent",
            sourceLabel: `来自：VPS 会话《${activeSess.title}》`,
            docId: message?.citations?.[0] || null,
            isLocal: true
          });
          showToast("✓ 已一键转为待办任务（再次点击可直达任务面板）");
          renderAll();
        };
      });

      container.querySelectorAll("[data-agent-copy]").forEach(btn => {
        btn.onclick = () => showToast("已复制回答正文与引用出处");
      });

      container.querySelectorAll("[data-withdraw-offline]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-withdraw-offline");
          const target = state.agentMessages.find(m => m.id === id);
          state.agentMessages = state.agentMessages.filter(m => m.id !== id);
          renderAll();
          if (target) {
            const input = document.getElementById("input-agent-prompt");
            if (input) { state.promptDraft = input.value = target.text; persist(); }
          }
          showToast("已从本机发件箱撤回，文字已放回输入框");
        };
      });

      const matPickerBtn = document.getElementById("btn-open-material-picker");
      if (matPickerBtn) matPickerBtn.onclick = () => openMaterialPickerSheet();

      const vpsModelBtn = document.getElementById("btn-open-vps-model-sheet");
      if (vpsModelBtn) vpsModelBtn.onclick = () => openVpsModelAndQuotaSheet();

      const sessionBtn = document.getElementById("btn-agent-session-sheet");
      if (sessionBtn) sessionBtn.onclick = () => openAgentSessionSheet();

      const sendForm = document.getElementById("form-agent-send");
      if (sendForm) {
        sendForm.querySelector("input").oninput = e => { state.promptDraft = e.target.value; persist(); };
        sendForm.onsubmit = (e) => {
          e.preventDefault();
          const input = document.getElementById("input-agent-prompt");
          const val = input.value.trim();
          if (!val || activeSess.archived) return;
          state.promptDraft = "";
          if (activeSess.title === "新会话") activeSess.title = val.slice(0, 24);
          activeSess.updated = "刚刚";

          let turnDocs = [];
          if (state.agentContextMode === "auto-rag") {
            turnDocs = autoRecallDocsForPrompt(val);
          } else if (state.agentContextMode === "manual") {
            turnDocs = [...attachedDocs];
          }
          const kbTotal = turnDocs.reduce((s, d) => s + parseFloat(getDocKb(d)), 0).toFixed(1);
          const userMsgId = "u-" + Date.now();

          if (state.agentOfflineMode) {
            state.agentMessages.push({
              id: userMsgId,
              role: "user",
              contextMode: state.agentContextMode,
              recalledDocIds: turnDocs.map(d => d.id),
              recalledKb: `${kbTotal} KB`,
              text: val,
              pendingOffline: true
            });
            showToast("当前处于弱网离线模拟：消息已存入本机发件箱，恢复网络后自动送达");
            renderAll();
            return;
          }

          const replyId = "a-" + Date.now();
          state.cotExpandedMap[replyId] = false;
          state.agentMessages.push({
            id: userMsgId,
            role: "user",
            contextMode: state.agentContextMode,
            recalledDocIds: turnDocs.map(d => d.id),
            recalledKb: `${kbTotal} KB`,
            text: val
          });

          const step1Text = state.agentContextMode === "auto-rag"
            ? `📱 手机本机 FTS5 自动检索命中 ${turnDocs.length} 篇相关笔记 (${kbTotal} KB)：${turnDocs.map(d => `《${d.title.slice(0, 10)}..》`).join("、")}`
            : state.agentContextMode === "manual"
            ? `📎 附带用户手动勾选的 ${turnDocs.length} 篇资料快照 (${kbTotal} KB)`
            : `🌐 纯云端模式：未附带本机资料片段，直接发往个人 Linux VPS`;

          state.agentMessages.push({
            id: replyId,
            role: "assistant",
            localRagSummary: state.agentContextMode === "auto-rag" ? `本机自动召回 ${turnDocs.length} 篇 (11ms)` : state.agentContextMode === "manual" ? `手动指定 ${turnDocs.length} 篇` : "纯云端推理",
            cotSteps: [
              { time: "11ms", text: step1Text },
              { time: "0.9s", text: `☁️ VPS Codex (${state.agentModel} · ${state.agentEffort}) 结合上下文完成推理` }
            ],
            cotDuration: "1.1s",
            text: `针对您的提问「**${val}**」：\n${turnDocs.length ? `手机端已通过 **${state.agentContextMode === "auto-rag" ? "本机 SQLite 自动检索" : "手动多选"}** 提取了 ${turnDocs.length} 篇相关片段（合计 ${kbTotal} KB）发往 VPS Codex。` : "已由个人 VPS Codex 直接完成云端推理。"}\n\n您可以直接点击下方 **[存为日志]** 或 **[转为任务]**，一键原地生成绿色回执，无需经过繁琐的多步确认弹窗。`,
            citations: turnDocs.map(d => d.id)
          });
          renderAll();
        };
      }

      container.querySelectorAll("[data-remove-mat]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-remove-mat");
          state.attachedMaterialIds = state.attachedMaterialIds.filter(item => item !== id);
          renderAll();
        };
      });
    }

    /* ========================================================================
       TAB 4: TASKS (任务闭环 · 来源快照回跳 · 完成与撤销)
       ======================================================================== */
    const taskViews = { focus: "今日聚焦", waiting: "等待跟进", all: "全部任务", done: "已完成" };
    const sourceNames = { craft: "Craft", dida: "滴答清单", insight: "洞察", agent: "助手", local: "本机" };
    function taskGroup(task) {
      if (task.done) return "done";
      if (task.waiting) return "waiting";
      if (task.due.startsWith("今天") || task.due.startsWith("逾期")) return "due";
      return task.planned ? "planned" : "later";
    }
    function taskList(task) { return task.list || task.sourceLabel.split(" / ").at(-1); }
    function taskRow(task) {
      const meta = task.waiting ? `等 ${task.waiting.who} · ${task.waiting.followUp || "未定回看日"}` :
        [task.priority, task.due, taskList(task)].filter(Boolean).join(" · ");
      return `<article class="task-row">
        <button class="task-check" data-toggle-task="${task.id}" aria-label="${task.done ? "恢复待办" : "完成任务"}：${escapeHtml(task.title)}" aria-pressed="${task.done}"><span>${task.done ? "✓" : ""}</span></button>
        <button class="task-open" data-task-detail="${task.id}"><strong>${escapeHtml(task.title)}</strong><small>${escapeHtml(meta)}</small></button>
      </article>`;
    }
    function toggleTask(task) {
      const before = task.done;
      task.done = !before;
      renderAll();
      showToast(task.done ? "已在本机标记完成" : "已恢复为待办", () => { task.done = before; renderAll(); });
    }

    function renderTasksTab(container) {
      const view = state.taskFilterStatus;
      const filtered = TASKS.filter(t => (state.taskFilterSource === "all" || t.sourceType === state.taskFilterSource)
        && (!state.taskListFilter || taskList(t) === state.taskListFilter));
      const groups = view === "focus" ? [["due","到期承诺"], ["planned","今日计划"], ["waiting","等待跟进"]] :
        [[view, taskViews[view]]];
      const hasFilter = state.taskFilterSource !== "all" || state.taskListFilter;
      container.innerHTML = `<div class="task-toolbar"><h2>${taskViews[view]}</h2><button class="flow-btn primary" id="btn-new-local-task">＋ 新建任务</button></div>
        <nav class="task-switch" aria-label="任务视图">${Object.entries(taskViews).map(([key,label]) =>
          `<button data-task-status="${key}" aria-pressed="${view === key}">${label}</button>`).join("")}</nav>
        <button class="task-filter" id="task-filter">${hasFilter ? escapeHtml([sourceNames[state.taskFilterSource], state.taskListFilter].filter(Boolean).join(" · ")) : "全部来源与清单"} ▾</button>
        ${groups.map(([key,label]) => {
          const rows = filtered.filter(t => key === "all" || taskGroup(t) === key);
          return `<section class="task-group"><h3>${label}<span>${rows.length}</span></h3>${rows.length ? rows.map(taskRow).join("") :
            `<p class="flow-empty">${hasFilter ? "当前筛选下没有任务" : "暂无" + label}${hasFilter ? '<button class="text-btn" data-reset-task>清除筛选</button>' : ""}</p>`}</section>`;
        }).join("")}`;
      container.querySelector("#btn-new-local-task").onclick = () => openNewTaskSheet();
      container.querySelector("#task-filter").onclick = openTaskFilter;
      container.querySelectorAll("[data-task-status]").forEach(b => b.onclick = () => { state.taskFilterStatus = b.dataset.taskStatus; renderAll(); });
      container.querySelectorAll("[data-task-detail]").forEach(b => b.onclick = () => openPushView("task-detail", b.dataset.taskDetail));
      container.querySelectorAll("[data-toggle-task]").forEach(b => b.onclick = () => toggleTask(TASKS.find(t => t.id === b.dataset.toggleTask)));
      container.querySelectorAll("[data-reset-task]").forEach(b => b.onclick = () => { state.taskFilterSource = "all"; state.taskListFilter = ""; renderAll(); });
    }

    function options(values, current) {
      return values.map(([key,label]) => `<option value="${escapeHtml(key)}" ${key === current ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");
    }
    function openTaskFilter() {
      openSheet(box => {
        const lists = [...new Set(TASKS.map(taskList))];
        box.innerHTML = `<form class="flow-form"><h2>筛选任务</h2>
          <label>来源<select name="source">${options([["all","全部来源"], ...Object.entries(sourceNames)], state.taskFilterSource)}</select></label>
          <label>项目与清单<select name="list">${options([["","全部清单"], ...lists.map(l => [l,l])], state.taskListFilter || "")}</select></label>
          <button class="flow-btn primary">应用筛选</button></form>`;
        box.querySelector("form").onsubmit = e => { e.preventDefault(); const form = e.target.elements;
          state.taskFilterSource = form.source.value; state.taskListFilter = form.list.value; closeSheet(); renderAll(); };
      });
    }

    function detailHeader(header, title) {
      header.innerHTML = `<button class="flow-back" aria-label="返回">‹ 返回</button><strong>${escapeHtml(title)}</strong><span></span>`;
      header.querySelector("button").onclick = closePushView;
    }
    function renderTaskDetail(task, header, body) {
      detailHeader(header, "任务详情");
      const doc = DOCUMENTS.find(d => d.id === task.docId);
      body.innerHTML = `<div class="flow-detail"><h2>${escapeHtml(task.title)}</h2>
        <p>${escapeHtml(taskList(task))} · ${escapeHtml(task.priority)} · ${escapeHtml(task.due)}</p>
        <div class="flow-actions"><button class="flow-btn" id="detail-done">${task.done ? "恢复待办" : "标记完成"}</button>
        <button class="flow-btn" id="detail-plan" ${task.done ? "disabled" : ""}>${task.planned ? "移出今日计划" : "加入今日计划"}</button></div>
        <h3>来源与依据</h3><p>${escapeHtml(task.sourceLabel)}</p>${doc ? `<button class="flow-btn" id="detail-source">查看原文 · ${escapeHtml(doc.title)}</button>` : ""}
        <h3>等待跟进</h3><p>${task.waiting ? escapeHtml(task.waiting.who + " · " + (task.waiting.followUp || "未定回看日")) : "当前无需等待"}</p>
        <div class="flow-actions"><button class="flow-btn" id="detail-wait">${task.waiting ? "修改等待" : "设置等待"}</button>${task.waiting ? '<button class="flow-btn" id="clear-wait">结束等待</button>' : ""}</div>
        <h3>续办备注</h3>${(task.notes || []).map(note => `<p class="task-note">${escapeHtml(note)}</p>`).join("")}
        <form class="flow-form inline-form"><label>补充进展<textarea name="note" rows="2" placeholder="下次接着做什么？">${escapeHtml(task.noteDraft || "")}</textarea></label>
        <button class="flow-btn primary">保存备注</button></form><small>任务变更保存在本机原型中</small></div>`;
      body.querySelector("#detail-done").onclick = () => toggleTask(task);
      body.querySelector("#detail-plan").onclick = () => { task.planned = !task.planned; renderAll(); };
      if (doc) body.querySelector("#detail-source").onclick = () => openPushView("doc-detail", doc.id);
      const clear = body.querySelector("#clear-wait");
      if (clear) clear.onclick = () => { task.waiting = null; renderAll(); };
      body.querySelector("#detail-wait").onclick = () => openSheet(box => {
        box.innerHTML = `<form class="flow-form"><h2>等待跟进</h2><label>等待谁或什么条件<input required name="who" value="${escapeHtml(task.waiting?.who || "")}"></label>
          <label>何时回看（选填）<input name="followUp" value="${escapeHtml(task.waiting?.followUp || "")}"></label><button class="flow-btn primary">保存等待</button></form>`;
        box.querySelector("form").onsubmit = e => { e.preventDefault(); const f = e.target.elements;
          if (!f.who.value.trim()) return; task.waiting = { who: f.who.value.trim(), followUp: f.followUp.value.trim() }; closeSheet(); renderAll(); };
      });
      const form = body.querySelector("form");
      form.elements.note.oninput = e => { task.noteDraft = e.target.value; persist(); };
      form.onsubmit = e => { e.preventDefault(); const note = form.elements.note.value.trim(); if (!note) return;
        (task.notes ||= []).push(note); task.noteDraft = ""; renderAll(); showToast("备注已存本机"); };
    }

    /* ========================================================================
       TAB 5: REVIEW (闪卡专注复习 · 单手翻面 + 底部四列评分 · 牌库 · AI 收件箱)
       ======================================================================== */
    const intervals = [["重来","10 分钟",10], ["困难","1 天",1440], ["良好","4 天",5760], ["简单","9 天",12960]];
    function cardSource(card) {
      return card.docId ? `<button class="flow-btn" data-card-source="${escapeHtml(card.docId)}">查看出处 · ${escapeHtml(card.source)}</button>` : `<p>来源 · ${escapeHtml(card.source)}</p>`;
    }
    function renderReviewTab(container) {
      const queue = dueCards(state.reviewDeck);
      const card = queue[0];
      const decks = [...new Set([...FLASHCARDS.map(c => c.deck), "UI 视觉与 Craft 交互细节"])];
      const names = { today: "今日复习", decks: "牌库", inbox: "AI 收件箱" };
      const counts = { today: dueCards().length, decks: decks.length, inbox: state.inboxCards.length };
      container.innerHTML = `<nav class="task-switch" aria-label="复习视图">${Object.entries(names).map(([key,name]) =>
        `<button data-review-subtab="${key}" aria-pressed="${state.reviewSubTab === key}">${name} (${counts[key]})</button>`).join("")}</nav>
        ${state.reviewSubTab === "today" ? `<div class="task-toolbar"><h3>${escapeHtml(state.reviewDeck || "全部牌组")}</h3><small>剩余 ${queue.length} 张</small></div>
          ${card ? `<section class="study-card"><small>${escapeHtml(card.deck)}</small>
            <button id="flashcard-surface" aria-expanded="${state.cardFlipped}"><strong>${escapeHtml(card.front)}</strong>
            <span>${state.cardFlipped ? escapeHtml(card.back) : "轻触查看答案"}</span></button>${cardSource(card)}</section>
            ${state.cardFlipped ? `<div class="rate-row">${intervals.map(([name,time]) => `<button data-rate-card="${name}">${name}<small>${time}</small></button>`).join("")}</div>` : ""}` :
            `<section class="flow-empty"><h3>${state.reviewDeck ? "本牌组已完成" : "今日复习已完成"}</h3><p>当前没有到期卡片</p><button class="flow-btn" data-review-subtab="decks">返回牌库</button></section>`}
          ${state.reviewDeck ? '<button class="text-btn" data-start-deck="">查看全部到期卡</button>' : ""}` :
          state.reviewSubTab === "decks" ? `<div class="task-group">${decks.map(deck => `<button class="deck-row" data-start-deck="${escapeHtml(deck)}"><strong>${escapeHtml(deck)}</strong><small>${dueCards(deck).length ? "待复习 " + dueCards(deck).length : "已完成"} ›</small></button>`).join("")}</div>` :
          state.inboxCards.length ? state.inboxCards.map(c => `<article class="study-card"><small>${escapeHtml(c.source)}</small><h3>${escapeHtml(c.front)}</h3><p>${escapeHtml(c.back)}</p>
            <div class="flow-actions"><button class="flow-btn primary" data-adopt-card="${c.id}">采用入库</button><button class="flow-btn" data-dismiss-card="${c.id}">跳过</button></div></article>`).join("") : '<p class="flow-empty">没有待确认的候选闪卡</p>'}`;
      container.querySelectorAll("[data-review-subtab]").forEach(b => b.onclick = () => { state.reviewSubTab = b.dataset.reviewSubtab; state.cardFlipped = false; renderAll(); });
      container.querySelectorAll("[data-start-deck]").forEach(b => b.onclick = () => { state.reviewDeck = b.dataset.startDeck; state.reviewSubTab = "today"; state.cardFlipped = false; renderAll(); });
      const surface = container.querySelector("#flashcard-surface");
      if (surface) surface.onclick = () => { state.cardFlipped = !state.cardFlipped; renderAll(); };
      const source = container.querySelector("[data-card-source]");
      if (source) source.onclick = () => openPushView("doc-detail", source.dataset.cardSource);
      container.querySelectorAll("[data-rate-card]").forEach(b => b.onclick = () => {
        if (!state.cardFlipped || dueCards(state.reviewDeck)[0]?.id !== card.id) return;
        const [label,,minutes] = intervals.find(([name]) => name === b.dataset.rateCard);
        state.reviewRatings[card.id] = { label, next: Date.now() + minutes * 60000 };
        state.cardFlipped = false; renderAll(); showToast("已记录：" + label);
      });
      container.querySelectorAll("[data-adopt-card],[data-dismiss-card]").forEach(b => b.onclick = () => {
        const item = state.inboxCards.find(c => c.id === (b.dataset.adoptCard || b.dataset.dismissCard));
        if (!item) return;
        state.inboxCards = state.inboxCards.filter(c => c.id !== item.id);
        if (b.dataset.adoptCard && !FLASHCARDS.some(c => c.id === item.id)) FLASHCARDS.push({ ...item, deck: "从资料提炼" });
        renderAll(); showToast(b.dataset.adoptCard ? "已加入牌库与今日队列" : "已跳过此候选");
      });
    }

    /* ========================================================================
       FULL-SCREEN PUSH VIEWS (True Library Folder Drill-Down, Doc Reader + Context Dock, Journals, Reading, Insights)
       ======================================================================== */
    // Each browser entry owns its filters and scroll positions. Mutations stay in the data store.
    let sheetId = null, routeQueued = false, restoring = false;
    const sheets = new Map();
    const routeFields = ["activeTab","pushStack","collectionQuery","searchType","searchQuery","selectedLibIds","selectedFolder",
      "taskFilterStatus","taskFilterSource","taskListFilter","selectedTagFilter","reviewDeck","reviewSubTab","cardFlipped"];
    function snapshot() {
      const route = Object.fromEntries(routeFields.map(k => [k,state[k]]));
      return { ...route, hubMobile: 5, sheetId, mainY: document.querySelector("#m-main").scrollTop,
        detailY: document.querySelector("#m-push-body").scrollTop };
    }
    function screenKey(route) {
      return JSON.stringify([route.activeTab, route.pushStack, route.activeTab === "review" ? [route.reviewSubTab,route.reviewDeck] : null]);
    }
    function rememberRoute() {
      const old = history.state, now = snapshot();
      if (!restoring && old?.hubMobile && screenKey(old) === screenKey(now) && old.sheetId === now.sheetId)
        history.replaceState(now,"");
    }
    function scheduleRoute() {
      if (restoring || routeQueued) return;
      routeQueued = true;
      queueMicrotask(() => {
        routeQueued = false;
        const now = snapshot(), old = history.state;
        if (old?.hubMobile !== 5) { history.replaceState(now,""); return; }
        const changed = screenKey(old) !== screenKey(now);
        if (changed) {
          const sameTab = old.activeTab === now.activeTab;
          if (!sameTab) document.querySelector("#m-main").scrollTop = now.mainY = 0;
          if (now.pushStack.length) document.querySelector("#m-push-body").scrollTop = now.detailY = 0;
        }
        if (old.sheetId && !now.sheetId && !changed) { history.back(); return; }
        if (old.sheetId && changed) history.replaceState(now,"");
        else if (changed || old.sheetId !== now.sheetId) history.pushState(now,"");
        else history.replaceState(now,"");
      });
    }
    function restoreRoute(route, reload = false) {
      if (route?.hubMobile !== 5) return;
      restoring = true;
      const sameScreen = screenKey(snapshot()) === screenKey(route);
      hideSheet();
      // A sheet may have just applied new filters to the same screen.
      if (!sameScreen || reload) for (const k of routeFields) state[k] = structuredClone(route[k]);
      renderAll();
      if (route.sheetId && sheets.has(route.sheetId)) mountSheet(route.sheetId, sheets.get(route.sheetId));
      else if (reload && route.sheetId?.startsWith("capture-")) openQuickCaptureSheet();
      document.querySelector("#m-main").scrollTop = route.mainY;
      document.querySelector("#m-push-body").scrollTop = route.detailY;
      restoring = false;
      history.replaceState(snapshot(),"");
    }
    window.addEventListener("popstate", e => restoreRoute(e.state));
    document.addEventListener("click", rememberRoute, true);
    window.addEventListener("pagehide", () => { endCaptureSegment(); rememberRoute(); });
    function openPushView(type, payload, replaceTop = false) {
      rememberRoute();
      state.collectionQuery = "";
      if (type === "doc-detail" && DOCUMENTS.some(d => d.id === payload))
        state.recentDocs = [payload, ...state.recentDocs.filter(id => id !== payload)].slice(0,100);
      if (replaceTop && state.pushStack.length) state.pushStack.pop();
      state.pushStack.push({type,payload});
      renderAll();
    }
    function closePushView() {
      if (state.pushStack.length) history.back();
    }

    function renderPushLayer() {

    // 2. FLOMO-STYLE QUICK CAPTURE & VOICE RECORDING SHEET
    let fileDatabase;
    function photoStore() {
      if (!fileDatabase) fileDatabase = new Promise((resolve, reject) => {
        const req = indexedDB.open("hub.mobile.prototype.photos", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("photos");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }).catch(error => { fileDatabase = null; throw error; });
      return fileDatabase;
    }
    async function savePhoto(file) {
      const db = await photoStore(), id = crypto.randomUUID();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        tx.objectStore("photos").put(file, id);
        tx.oncomplete = resolve; tx.onabort = () => reject(tx.error);
      });
      return { id, name: file.name };
    }
    async function displayPhoto(img, id) {
      try {
        const db = await photoStore();
        const blob = await new Promise((resolve, reject) => {
          const req = db.transaction("photos").objectStore("photos").get(id);
          req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
        });
        if (!blob || !img.isConnected) return;
        const url = URL.createObjectURL(blob);
        img.onload = img.onerror = () => URL.revokeObjectURL(url);
        img.src = url;
      } catch { img.alt += "（无法读取）"; }
    }
    let addingPhotos = false;
    function openQuickCaptureSheet() {
      openSheet(box => {
        function renderCapture() {
          box.innerHTML = `<form class="flow-form" id="capture-form">
            <div class="task-toolbar"><h2>速记</h2><button type="button" id="cap-close" class="flow-btn">收起</button></div>
            ${state.captureQuote ? `<div class="flow-actions">关联《${escapeHtml(state.captureQuote.title)}》<button class="text-btn" type="button" id="cap-remove-quote">移除</button></div>` : ""}
            <label>正文<textarea id="cap-textarea" rows="4" placeholder="记下此刻的想法…">${escapeHtml(state.captureDraft)}</textarea></label>
            <div class="flow-actions">${["#架构思考","#闪念","#阅读摘录","#待验证"].map(t =>
              `<button type="button" class="flow-btn" data-cap-tag="${t}" aria-pressed="${state.captureTags.includes(t)}">${t}</button>`).join("")}</div>
            <label>归属日期<input type="date" name="date" required value="${escapeHtml(state.captureDate || localDay())}"></label>
            <div class="flow-actions"><label class="flow-btn file-label">添加图片<input type="file" id="cap-files" accept="image/*" multiple ${addingPhotos ? "disabled" : ""}></label>
              <button type="button" class="flow-btn" id="cap-btn-voice">${state.captureRecording ? "结束本段" : "模拟录音"}</button></div>
            ${state.captureFiles.map((f,i) => `<div class="capture-item"><img data-photo="${f.id}" alt="${escapeHtml(f.name)}"><span>${escapeHtml(f.name)}</span><button type="button" class="text-btn" data-remove-file="${i}">移除</button></div>`).join("")}
            ${state.captureSegments.map((v,i) => `<div class="capture-item"><span>模拟语音 ${i+1} · ${v.seconds} 秒</span><button type="button" class="text-btn" data-remove-segment="${i}">移除</button></div>`).join("")}
            <div class="task-toolbar"><small id="draft-status" role="status">${addingPhotos ? "正在保存图片…" : "草稿存于此浏览器"}</small>
            <button class="flow-btn primary" id="cap-submit" ${addingPhotos || state.captureRecording ? "disabled" : ""}>记下</button></div></form>`;
          const form = box.querySelector("form");
          form.querySelectorAll("[data-photo]").forEach(img => displayPhoto(img,img.dataset.photo));
          const update = () => { if (!persist()) form.querySelector("#draft-status").textContent = "保存失败，草稿仍在此页"; };
          form.querySelector("#cap-textarea").oninput = e => { state.captureDraft = e.target.value; update(); };
          form.elements.date.oninput = e => { state.captureDate = e.target.value; update(); };
          form.querySelector("#cap-close").onclick = closeSheet;
          const rm = form.querySelector("#cap-remove-quote");
          if (rm) rm.onclick = () => { state.captureQuote = null; update(); renderCapture(); };
          form.querySelectorAll("[data-cap-tag]").forEach(b => b.onclick = () => { const t = b.dataset.capTag;
            state.captureTags = state.captureTags.includes(t) ? state.captureTags.filter(x => x !== t) : [...state.captureTags,t];
            update(); renderCapture(); });
          form.querySelectorAll("[data-remove-file],[data-remove-segment]").forEach(b => b.onclick = () => {
            if (b.hasAttribute("data-remove-file")) state.captureFiles.splice(Number(b.dataset.removeFile),1);
            else state.captureSegments.splice(Number(b.dataset.removeSegment),1);
            update(); renderCapture();
          });
          form.querySelector("#cap-btn-voice").onclick = () => {
            if (state.captureRecording) endCaptureSegment();
            else state.captureRecording = Date.now();
            update(); renderCapture();
          };
          form.querySelector("#cap-files").onchange = async e => {
            const files = [...e.target.files];
            if (state.captureFiles.length + files.length > 9 || files.some(f => !f.type.startsWith("image/") || f.size > 20*1024*1024)) {
              showToast("最多 9 张图片，每张不超过 20 MB"); return;
            }
            addingPhotos = true; renderCapture();
            try { for (const file of files) { state.captureFiles.push(await savePhoto(file)); persist(); } }
            catch { showToast("图片保存失败，请重试"); }
            finally { addingPhotos = false; if (document.querySelector("#capture-form")) renderCapture(); }
          };
          form.onsubmit = e => {
            e.preventDefault();
            if (addingPhotos || state.captureRecording) return;
            if (!state.captureDraft.trim() && !state.captureSegments.length && !state.captureFiles.length) { showToast("请写正文或添加附件"); return; }
            const draft = Object.fromEntries(draftKeys.map(key => [key,state[key]]));
            const entry = { id: crypto.randomUUID(), date: state.captureDate || localDay(),
              time: new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}), createdAt: Date.now(),
              receipt:"local", receiptText:"已存本机 · 待上传", tags:state.captureTags, text:state.captureDraft.trim(),
              quote:state.captureQuote, segments:state.captureSegments, attachments:state.captureFiles, simulatedSync:true };
            JOURNALS.unshift(entry);
            Object.assign(state,{captureDraft:"",captureQuote:null,captureDate:"",captureTags:[],captureSegments:[],captureFiles:[]});
            if (!persist()) { JOURNALS.shift(); Object.assign(state,draft); return; }
            closeSheet(); openPushView("journal-detail",entry.id); showToast("已存本机");
          };
        }
        persist(); renderCapture();
      }, "capture");
    }
    function endCaptureSegment() {
      if (!state.captureRecording) return;
      state.captureSegments.push({ seconds: Math.max(1,Math.round((Date.now()-state.captureRecording)/1000)) });
      state.captureRecording = false;
      persist();
    }
    function openReceiptSheet(journal) {

    function openNewTaskSheet(doc = null) {

      openSheet(box => {
        box.innerHTML = `<form class="flow-form"><h2>${doc ? "从原文创建任务" : "新建本机任务"}</h2>
          ${doc ? `<p>来源 · ${escapeHtml(doc.title)}</p>` : ""}

          <label>保存到清单<input name="list" required value="${escapeHtml(state.taskListFilter || "本机任务")}"></label>

          <div class="flow-actions"><button type="button" class="flow-btn" id="task-sheet-close">取消</button><button class="flow-btn primary">创建任务</button></div></form>`;
        box.querySelector("#task-sheet-close").onclick = closeSheet;
        box.querySelector("form").onsubmit = e => {
          e.preventDefault(); const f = e.target.elements;
          if (!f.title.value.trim() || !f.list.value.trim()) return;
          const task = { id: crypto.randomUUID(), title: f.title.value.trim(), list: f.list.value.trim(), planned: f.planned.checked,
            done: false, due: "无截止日", priority: "普通", sourceType: "local", isLocal: true,
            docId: doc?.id || null, sourceLabel: doc ? doc.libraryName + " / " + doc.folderPath : "本机新建",
            originKey: doc ? "document:" + doc.id : null };
          TASKS.unshift(task); closeSheet(); openPushView("task-detail", task.id); showToast("已创建本机任务");
        };
      });
    }

          state.readingLargeFont = !state.readingLargeFont;
          document.documentElement.setAttribute("data-reading-size", state.readingLargeFont ? "large" : "normal");
          showToast(`已切换阅读正文字号为 ${state.readingLargeFont ? "19px 大字" : "17px 标准"}`);
          openSpaceMenuSheet();
        };
        box.querySelectorAll("[data-menu-theme]").forEach(btn => {
          btn.onclick = () => {
            document.documentElement.setAttribute("data-theme", btn.getAttribute("data-menu-theme"));
          };
        });
        box.querySelectorAll("[data-menu-accent]").forEach(btn => {
          btn.onclick = () => {
            document.documentElement.setAttribute("data-accent", btn.getAttribute("data-menu-accent"));
          };
        });
      });
    }

    /* ========================================================================
       Studio Inspector & Global Bindings
       ======================================================================== */
    document.getElementById("btn-fab-capture").onclick = () => openQuickCaptureSheet();

    document.getElementById("btn-toggle-frame").onclick = () => {
      const html = document.documentElement;
      const next = html.getAttribute("data-frame") === "fullscreen" ? "phone" : "fullscreen";
      html.setAttribute("data-frame", next);
      document.getElementById("frame-toggle-label").textContent = next === "fullscreen" ? "退出满屏" : "切换 1:1 真机满屏";
    };

    document.querySelectorAll("[data-set-theme]").forEach(btn => {
      btn.onclick = () => document.documentElement.setAttribute("data-theme", btn.getAttribute("data-set-theme"));
    });

    document.querySelectorAll("[data-set-accent]").forEach(btn => {
      btn.onclick = () => document.documentElement.setAttribute("data-accent", btn.getAttribute("data-set-accent"));
    });

    document.querySelectorAll("[data-scenario]").forEach(btn => {
      btn.onclick = () => {
        const sc = btn.getAttribute("data-scenario");
        closeSheet();
        state.pushStack = [];
        if (sc === "browse-libs") {
          state.activeTab = "browse";
          state.expandedBrowseLibs.craft = true;
          state.expandedBrowseLibs.obsidian = true;
          renderAll();
        } else if (sc === "folder-drill") {
          state.activeTab = "browse";
          openPushView("library-detail", { libId: "craft", folderId: "craft-arch" });
        } else if (sc === "scope-sheet") {
          state.activeTab = "search";
          renderAll();
          openScopeFilterSheet();
        } else if (sc === "quick-capture") {
          openQuickCaptureSheet();
        } else if (sc === "agents-cot") {
          state.activeTab = "agents";
          state.agentSubTab = "chat";
          state.cotExpandedMap["m-2"] = true;
          renderAll();
        } else if (sc === "doc-context") {
          openPushView("doc-detail", "doc-1");
        } else if (sc === "review-study") {
          state.activeTab = "review";
          state.reviewSubTab = "today";
          state.cardFlipped = true;
          renderAll();
        }
      };
    });

    // Global Escape & Android Hardware Back Key Simulation (Closes Sheet -> Pops Push Stack)
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const sheetLayer = document.getElementById("m-sheet-layer");
        if (sheetLayer && sheetLayer.classList.contains("is-open")) {
          history.back();
          return;
        }
        if (state.pushStack.length > 0) {
          closePushView();
        }
      }
    });

    document.getElementById("sim-oss-btn").onclick = (e) => {
      state.ossStatus = state.ossStatus === "os" ? "pending" : "os";
      e.currentTarget.querySelector("span").textContent = state.ossStatus === "os" ? "☁️ OSS：已写入 OS" : "☁️ OSS：待上传 2 条";
      renderAll();
    };

    document.getElementById("sim-vps-btn").onclick = (e) => {
      state.vpsStatus = state.vpsStatus === "online" ? "busy" : "online";
      e.currentTarget.querySelector("span").textContent = state.vpsStatus === "online" ? "⚡ VPS：在线可用" : "⚡ VPS：推理运行中";
      renderAll();
    };

    document.getElementById("exit-fullscreen").onclick = () => document.getElementById("btn-toggle-frame").click();
    restoreData();
    if (history.state?.hubMobile === 5) restoreRoute(history.state,true);
    else renderAll();
  </script>
</body>
</html>
