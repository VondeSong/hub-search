<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub 本地桌面原型 · 统一工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      /* Base White Architecture: Apple macOS HIG + Craft Elevation + Notion Reduction + Claude Reading + Codex Precision */
      --bg-app: #F5F6F8;
      --bg-sidebar: rgba(246, 247, 249, 0.84);
      --bg-titlebar: rgba(255, 255, 255, 0.86);
      --bg-surface: #F5F6F8;
      --bg-paper: #FFFFFF;
      --bg-subtle: rgba(15, 23, 42, 0.04);
      --bg-hover: rgba(15, 23, 42, 0.055);
      --bg-active: rgba(0, 122, 255, 0.085);
      --bg-code: #F4F5F7;

      --ink-primary: #18181B;
      --ink-secondary: #52525B;
      --ink-tertiary: #8A8F98;
      --ink-muted: #B0B5BD;

      --accent: #007AFF;        /* Apple macOS HIG System Blue */
      --accent-ink: #18181B;    /* Notion / Codex Charcoal Primary Action */
      --accent-soft: rgba(0, 122, 255, 0.085);
      --accent-green: #1E8E5A;
      --accent-amber: #C47F17;
      --accent-red: #D13B34;

      --hairline: rgba(15, 23, 42, 0.075);
      --hairline-strong: rgba(15, 23, 42, 0.13);
      --paper-shadow: 0 1px 2px rgba(15, 23, 42, 0.035), 0 8px 24px -8px rgba(15, 23, 42, 0.06);
      --card-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 3px 10px -2px rgba(15, 23, 42, 0.035);
      --modal-shadow: 0 24px 64px -12px rgba(15, 23, 42, 0.20), 0 0 0 0.5px rgba(15, 23, 42, 0.10);

      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Inter", "Microsoft YaHei", sans-serif;
      --font-serif: "New York", "Songti SC", "Noto Serif SC", Georgia, serif;
      --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--ink-primary);
      font-size: 13.5px;
      line-height: 1.5;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .font-mono-eng {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .font-reading-serif { font-family: var(--font-serif); }

    /* macOS Vibrancy & 0.5px Hairlines */
    .mac-vibrancy {
      background: var(--bg-sidebar);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }
    .mac-titlebar {
      background: var(--bg-titlebar);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      border-bottom: 0.5px solid var(--hairline);
    }

    .hairline-r { border-right: 0.5px solid var(--hairline); }
    .hairline-l { border-left: 0.5px solid var(--hairline); }
    .hairline-t { border-top: 0.5px solid var(--hairline); }
    .hairline-b { border-bottom: 0.5px solid var(--hairline); }

    /* Craft Elevated White Paper Surface */
    .paper-sheet {
      background: var(--bg-paper);
      border: 0.5px solid var(--hairline);
      box-shadow: var(--paper-shadow);
      border-radius: 14px;
    }
    .inset-group {
      background: var(--bg-paper);
      border: 0.5px solid var(--hairline);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }
    .inset-row {
      border-bottom: 0.5px solid var(--hairline);
      transition: background-color 140ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .inset-row:last-child { border-bottom: none; }
    .inset-row:hover { background: var(--bg-hover); }
    .inset-row.selected { background: var(--bg-active); }

    /* Native macOS / Notion Borderless Tree Rows (Zero Horizontal Divider Clutter) */
    .tree-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 31px;
      padding-top: 4px;
      padding-bottom: 4px;
      padding-right: 8px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--ink-secondary);
      transition: background-color 110ms ease, color 110ms ease, box-shadow 110ms ease;
    }
    .tree-row:hover {
      background: var(--bg-hover);
      color: var(--ink-primary);
    }
    .tree-row.selected {
      background: var(--bg-paper);
      color: var(--ink-primary);
      font-weight: 550;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 0 0 0.5px var(--hairline-strong);
    }
    .tree-row.selected .tree-row-accent {
      opacity: 1;
    }
    .tree-row-accent {
      position: absolute;
      left: 2px;
      top: 7px;
      bottom: 7px;
      width: 2.5px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 120ms ease;
    }

    /* Notion Hover-reveal */
    .hover-reveal {
      opacity: 0;
      transition: opacity 130ms ease;
    }
    .group:hover .hover-reveal,
    .inset-row:hover .hover-reveal,
    .inset-row.selected .hover-reveal,
    .tree-row:hover .hover-reveal,
    .tree-row.selected .hover-reveal,
    .space-card.selected .hover-reveal,
    .hover-reveal:focus-visible {
      opacity: 1;
    }

    /* Craft Space Cards (Folder Stack & Document Mini-Sheet) */
    .space-card {
      position: relative;
      background: var(--bg-paper);
      border: 0.5px solid var(--hairline);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      transition: transform 150ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 150ms ease, border-color 150ms ease;
      cursor: pointer;
    }
    .space-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.09), 0 1px 3px rgba(15, 23, 42, 0.04);
      border-color: var(--hairline-strong);
    }
    .space-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1.5px var(--accent), 0 10px 26px -8px rgba(0, 122, 255, 0.16);
    }

    /* Folder Stack Illusion */
    .folder-stack::before,
    .folder-stack::after {
      content: "";
      position: absolute;
      left: 10px; right: 10px;
      height: 8px;
      border-radius: 10px 10px 0 0;
      background: #FFFFFF;
      border: 0.5px solid var(--hairline);
      border-bottom: none;
      pointer-events: none;
      transition: transform 160ms ease;
    }
    .folder-stack::before {
      top: -5px;
      left: 12px; right: 12px;
      opacity: 0.85;
      z-index: -1;
    }
    .folder-stack::after {
      top: -9px;
      left: 22px; right: 22px;
      opacity: 0.55;
      z-index: -2;
    }
    .folder-stack:hover::before { transform: translateY(-1px); }
    .folder-stack:hover::after { transform: translateY(-2px); }

    /* Mini-Sheet Preview Skeleton inside Document Card */
    .mini-preview-box {
      background: var(--bg-surface);
      border: 0.5px solid var(--hairline);
      border-radius: 9px;
      padding: 9px 10px;
      font-size: 11px;
      color: var(--ink-secondary);
    }

    /* Xcode-style Jump Bar Dropdown */
    .jump-bar-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 240px;
      max-width: 320px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 45;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 0.5px solid var(--hairline-strong);
      border-radius: 12px;
      box-shadow: var(--modal-shadow);
      padding: 6px;
    }

    /* Claude Reading Measure */
    .reading-prose {
      max-width: 68ch;
      line-height: 1.75;
      color: var(--ink-primary);
    }
    .reading-prose p { margin: 0 0 1em 0; }
    .reading-prose h2 {
      font-size: 1.06rem;
      font-weight: 600;
      margin: 1.4em 0 0.55em 0;
      letter-spacing: -0.01em;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.14); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(15, 23, 42, 0.28); }

    /* Interactive Controls */
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      width: 100%; padding: 6px 10px; border-radius: 8px;
      color: var(--ink-secondary); font-size: 13px; font-weight: 450;
      transition: background-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
      text-align: left; cursor: pointer;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--ink-primary); }
    .nav-item.active {
      background: var(--bg-paper);
      color: var(--ink-primary);
      font-weight: 550;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 0 0 0.5px var(--hairline);
    }
    .nav-item.active i,
    .nav-item.active svg {
      color: var(--accent);
    }

    .pill-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 999px; font-size: 12px;
      color: var(--ink-secondary); background: var(--bg-subtle);
      border: 0.5px solid transparent;
      transition: all 140ms cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer; white-space: nowrap;
    }
    .pill-btn:hover { background: var(--bg-hover); color: var(--ink-primary); }
    .pill-btn.active {
      background: var(--accent-soft); color: var(--accent);
      border-color: rgba(0, 122, 255, 0.22); font-weight: 500;
    }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 7px;
      color: var(--ink-secondary);
      transition: background-color 120ms ease, color 120ms ease;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--ink-primary); }
    .icon-btn.active { background: var(--bg-active); color: var(--accent); }

    .primary-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--accent-ink); color: #FFFFFF;
      border-radius: 999px; font-weight: 500; cursor: pointer;
      transition: opacity 140ms ease, transform 120ms ease;
    }
    .primary-btn:hover { opacity: 0.88; }
    .primary-btn:active { transform: scale(0.98); }

    /* Draggable hairline resizer */
    .split-resizer { width: 5px; cursor: col-resize; position: relative; flex-shrink: 0; }
    .split-resizer::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 2px;
      width: 0.5px; background: var(--hairline); transition: background-color 140ms ease, width 140ms ease;
    }
    .split-resizer:hover::after, .split-resizer.dragging::after { width: 2px; left: 1.5px; background: var(--accent); }

    .traffic-dot { width: 11px; height: 11px; border-radius: 999px; display: inline-block; border: 0.5px solid rgba(0,0,0,0.12); }

    .ambient-bg {
      background-image:
        radial-gradient(circle at 6% 10%, rgba(0, 122, 255, 0.036), transparent 34%),
        radial-gradient(circle at 92% 88%, rgba(15, 23, 42, 0.024), transparent 38%);
    }

    /* Diff & Search Highlights */
    .diff-add { background: rgba(30, 142, 90, 0.10); color: var(--accent-green); }
    .diff-del { background: rgba(209, 59, 52, 0.09); color: var(--accent-red); }
    mark.search-hit { background: rgba(250, 204, 21, 0.24); color: inherit; padding: 0 2px; border-radius: 3px; }
    mark.search-hit.active { background: rgba(245, 158, 11, 0.42); box-shadow: inset 0 -1.5px 0 #D97706; }

    /* Rich Document Blocks */
    .doc-toc { background: var(--bg-surface); border: 0.5px solid var(--hairline); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
    .doc-callout { background: var(--bg-surface); border: 0.5px solid var(--hairline); border-left: 2.5px solid var(--accent); border-radius: 8px; padding: 11px 14px; margin: 14px 0; font-size: 13px; color: var(--ink-secondary); line-height: 1.65; }
    .doc-table-wrap { margin: 16px 0; border: 0.5px solid var(--hairline); border-radius: 10px; overflow-x: auto; background: var(--bg-paper); }
    .doc-table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    .doc-table th { background: var(--bg-surface); color: var(--ink-secondary); font-weight: 550; padding: 8px 12px; border-bottom: 0.5px solid var(--hairline); white-space: nowrap; }
    .doc-table td { padding: 8px 12px; border-bottom: 0.5px solid var(--hairline); color: var(--ink-primary); vertical-align: top; line-height: 1.55; }
    .doc-table tr:last-child td { border-bottom: none; }
    .doc-attachment { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg-surface); border: 0.5px solid var(--hairline); transition: background-color 140ms ease; cursor: pointer; }
    .doc-attachment:hover { background: var(--bg-hover); }

    /* Quick Assistant */
    .quick-assistant-fab {
      position: fixed; right: 20px; bottom: 36px; z-index: 35;
      display: inline-flex; align-items: center; gap: 7px;
      height: 36px; padding: 0 14px; border-radius: 999px;
      background: var(--bg-paper); color: var(--ink-primary);
      border: 0.5px solid var(--hairline-strong);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.10), 0 1px 3px rgba(15, 23, 42, 0.06);
      font-size: 12.5px; font-weight: 500; cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
    }
    .quick-assistant-fab:hover { transform: translateY(-1px); border-color: rgba(0, 122, 255, 0.35); box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14); }
    .workspace-content { position: relative; display: flex; flex: 1; min-width: 0; }
    .paper-breadcrumbs > div { min-width: 0; }
    .paper-breadcrumbs > div > button { max-width: 100%; overflow: hidden; white-space: nowrap; }
    .paper-breadcrumbs > div > button > span:last-of-type { overflow: hidden; text-overflow: ellipsis; }
    .paper-breadcrumbs > .icon-btn { flex-shrink: 0; }
    .agent-demo-menu[hidden], .agent-demo-popover[hidden], .quick-assistant-panel[hidden], .agent-source[hidden] { display: none; }
    .agent-demo-menu { position: relative; display: inline-flex; align-items: center; }
    .agent-demo-trigger {
      display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
      border-radius: 6px; border: 0.5px solid var(--hairline); background: var(--bg-paper);
      color: var(--ink-secondary); font: 500 11px/1 Inter, "Microsoft YaHei", sans-serif;
      cursor: pointer; transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .agent-demo-trigger:hover, .agent-demo-trigger[aria-expanded="true"] {
      color: var(--ink-primary); border-color: rgba(15, 23, 42, 0.16); background: #FFFFFF;
    }
    .agent-demo-caret { font-size: 9px; opacity: 0.65; transition: transform 140ms ease; }
    .agent-demo-trigger[aria-expanded="true"] .agent-demo-caret { transform: rotate(180deg); }
    .agent-demo-popover {
      position: absolute; right: 0; bottom: calc(100% + 8px); width: 248px; padding: 6px;
      border-radius: 12px; background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 0.5px solid rgba(15, 23, 42, 0.12);
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.16), 0 0 0 0.5px rgba(15, 23, 42, 0.04);
      font-family: Inter, "Microsoft YaHei", sans-serif; z-index: 60;
    }
    .agent-demo-heading {
      padding: 4px 8px 6px; font-size: 10.5px; font-weight: 600; color: var(--ink-tertiary);
      display: flex; align-items: center; justify-content: space-between;
    }
    .agent-cases { display: flex; flex-direction: column; gap: 2px; }
    .agent-cases button {
      width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
      padding: 6px 8px; border-radius: 8px; text-align: left; color: var(--ink-secondary);
      cursor: pointer; transition: background 120ms ease, color 120ms ease;
    }
    .agent-cases button:hover { background: var(--bg-hover); color: var(--ink-primary); }
    .agent-cases button[aria-pressed="true"] { background: var(--bg-subtle); color: var(--ink-primary); }
    .agent-case-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .agent-case-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; line-height: 1.25; }
    .agent-case-desc { font-size: 10.5px; color: var(--ink-tertiary); line-height: 1.3; }
    .agent-case-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .agent-case-check { font-size: 11px; color: var(--accent); opacity: 0; flex-shrink: 0; margin-top: 1px; }
    .agent-cases button[aria-pressed="true"] .agent-case-check { opacity: 1; }
    .agent-demo-footer {
      margin-top: 6px; padding: 6px 8px 2px; border-top: 0.5px solid var(--hairline);
      font-size: 10.5px; color: var(--ink-tertiary); display: flex; align-items: center; justify-content: space-between;
    }
    .quick-assistant-panel {
      width: min(510px, 100%); min-width: 0; flex-shrink: 0; z-index: 38;
      border-left: 1px solid #E7E6E2; background: #FCFCFB;
    }
    .quick-assistant-panel[data-layout="floating"],
    .quick-assistant-panel[data-layout="expanded"] {
      position: absolute; inset: 12px 12px 12px auto;
      width: min(460px, calc(100% - 24px)); border: 1px solid #E7E6E2;
      border-radius: 16px; box-shadow: 0 20px 50px -10px #1a191829; overflow: hidden;
    }
    .quick-assistant-panel[data-layout="expanded"] {
      right: auto; left: 50%; transform: translateX(-50%); width: min(820px, calc(100% - 24px));
    }
    #workspace-content[inert] { opacity: .4; }
    .quick-assistant-panel iframe, .agent-source iframe { display: block; border: 0; width: 100%; height: 100%; }
    .agent-source { display: flex; flex-direction: column; position: absolute; inset: 0; z-index: 39; background: #fff; }
    .agent-source iframe { flex: 1; min-height: 0; }
    .agent-source > button {
      align-self: flex-start; padding: 7px 14px; color: var(--accent); font-size: 12px;
    }
    @media (max-width: 920px) {
      .quick-assistant-panel[data-layout="docked"] { position: absolute; inset: 0 0 0 auto; }
      #workspace-content:has(.agent-source:not([hidden])) { position: static; }
    }

    /* Continuous Multi-Level Tree Indentation Guides */
    .tree-guide-line {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 1px;
      background: rgba(15, 23, 42, 0.068);
      pointer-events: none;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view { animation: fadeSlideIn 150ms cubic-bezier(0.2, 0.8, 0.2, 1); }

    .toast-glass {
      background: rgba(24, 24, 27, 0.90); color: #FFFFFF;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @media (max-width: 820px) {
      #desktop-sidebar {
        position: fixed; top: 44px; bottom: 26px; left: 0; z-index: 40;
        box-shadow: 12px 0 32px rgba(15, 23, 42, 0.12);
      }
      #desktop-sidebar.collapsed { transform: translateX(-100%); width: 236px !important; opacity: 0; pointer-events: none; }
    }

    .pro-pill-wrap {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 0.5px solid var(--hairline);
      gap: 2px;
    }
    .pro-pill-btn {
      font-size: 11px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--ink-secondary);
      transition: all 140ms ease;
      cursor: pointer;
    }
    .pro-pill-btn.active {
      background: var(--bg-paper);
      color: var(--ink-primary);
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .embed-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #F5F6F8;
    }
    .embed-frame.active {
      display: block;
    }
  </style>
</head>
<body class="ambient-bg select-none">

  <!-- Full Desktop App Shell -->
  <div id="app-shell" class="flex flex-col h-screen w-screen overflow-hidden">

    <!-- macOS Unified Translucent Titlebar (44px) -->
    <header class="mac-titlebar h-11 flex items-center justify-between px-3.5 shrink-0 z-30">
      <div class="flex items-center gap-3 min-w-0">
        <div class="hidden sm:flex items-center gap-1.5 pr-1" aria-hidden="true">
          <span class="traffic-dot" style="background:#FF5F57"></span>
          <span class="traffic-dot" style="background:#FEBC2E"></span>
          <span class="traffic-dot" style="background:#28C840"></span>
        </div>

        <button id="btn-toggle-sidebar" class="icon-btn" title="收起/展开侧栏 (⌘\)" aria-label="切换侧栏">
          <i data-lucide="panel-left" class="w-4 h-4"></i>

    function getLib(id) { return LIBRARIES.find(l => l.id === id) || LIBRARIES[0]; }

    function getSpaceNode(id) { return SPACE_NODES.find(n => n.id === id) || null; }
    function getSpaceChildren(parentId) { return SPACE_NODES.filter(n => n.parent === parentId); }
    function getSpaceAncestors(nodeId) {
      const chain = [];
      let cur = getSpaceNode(nodeId);
      while (cur) { chain.unshift(cur); cur = getSpaceNode(cur.parent); }
      return chain;
    }

    function openPaperInSpace(nodeId, asSecondPaper = false) {
      const node = getSpaceNode(nodeId);
      if (!node) return;

      state.view = 'space';

          ? state.readerPapers[0]

          showToast(`已并排摊开对照：《${node.title}》`, 'columns-2');
        }
        renderAll();
        return;
      }

      state.spaceLib = node.lib;
      state.spaceSurface = 'split';
      state.spaceSelectedCardId = node.id;
      getSpaceAncestors(node.id).forEach(a => state.spaceExpandedIds.add(a.id));
      if (getSpaceChildren(node.id).length > 0) state.spaceExpandedIds.add(node.id);
      renderAll();
    }

    function getVisibleHierarchyList() {
      const q = state.spaceFilter.trim().toLowerCase();
      if (state.spaceLib === 'favorites') {
        return SPACE_NODES
          .filter(n => state.libFavorites.has(n.id) && (!q || n.title.toLowerCase().includes(q) || (n.snippet || '').toLowerCase().includes(q)))
          .map(n => ({ node: n, depth: 0 }));
      }
      if (state.spaceLib === 'topic') {
        return SPACE_NODES
          .filter(n => state.libTopicItems.has(n.id) && (!q || n.title.toLowerCase().includes(q) || (n.snippet || '').toLowerCase().includes(q)))
          .map(n => ({ node: n, depth: 0 }));
      }
      if (q) {
        return SPACE_NODES
          .filter(n => n.lib === state.spaceLib && (n.title.toLowerCase().includes(q) || (n.snippet || '').toLowerCase().includes(q)))
          .map(n => ({ node: n, depth: Math.max(0, getSpaceAncestors(n.id).length - 1) }));
      }

      const rootId = state.spaceFolderId || ('root-' + state.spaceLib);
      const out = [];
      const walk = (parentId, depth) => {
        const kids = getSpaceChildren(parentId).sort((a, b) => (a.kind === 'folder' ? -1 : 1) - (b.kind === 'folder' ? -1 : 1));
        for (const k of kids) {
          out.push({ node: k, depth });
          if (state.spaceExpandedIds.has(k.id) && getSpaceChildren(k.id).length > 0) {
            walk(k.id, depth + 1);
          }
        }
      };
      walk(rootId, 0);
      return out;
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeRegExp(str) { return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

      el.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5 shrink-0" style="color:var(--accent)"></i><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      safeIcons({ nodes: [el] });
      setTimeout(() => {
        el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; el.style.transition = 'all 180ms ease';
        setTimeout(() => el.remove(), 200);
      }, 2400);
    }

      if (!obj) return '';

        if (b.type === 'table') return [b.headers.join(' '), ...b.rows.map(r => r.join(' '))].join(' ');
        if (b.type === 'attachments') return b.items.map(i => i.name + ' ' + i.meta).join(' ');
        return b.text || '';
      }).join('\n');
    }

    function highlightSnippet(text, query) {
      const safe = escapeHtml(text || '');
      const q = (query || '').trim();
      return !q ? safe : safe.replace(new RegExp(`(${escapeRegExp(q)})`, 'gi'), '<mark class="search-hit">$1</mark>');
    }

    function highlightRichText(text, query, hitCounter) {
      let safe = escapeHtml(text || '')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code class="font-mono-eng text-[12.5px] px-1.5 py-0.5 rounded" style="background:var(--bg-code)">$1</code>')
        .replace(/\n/g, '<br>');
      const q = (query || '').trim();
      if (!q || !hitCounter) return safe;
      const re = new RegExp(`(${escapeRegExp(q)})`, 'gi');
      return safe.split(/(<[^>]+>)/g).map(part => {
        if (part.startsWith('<')) return part;
        return part.replace(re, match => {
          const idx = hitCounter.count++;
          return `<mark class="search-hit ${idx === state.inDocHitIndex ? 'active' : ''}" data-hit-idx="${idx}">${match}</mark>`;
        });
      }).join('');
    }

    function countQueryHitsInTarget(target, query) {
      const q = (query || '').trim();
      if (!q || !target) return 0;
      const m = `${target.title || ''}\n${getDocPlainText(target)}`.match(new RegExp(escapeRegExp(q), 'gi'));
      return m ? m.length : 0;
    }

    function renderDocumentBlocks(target, query, hitCounter) {
      return (target.blocks || []).map(block => {
        if (block.type === 'h2') return `<h2 id="${block.id || ''}" class="scroll-mt-16">${highlightRichText(block.text, query, hitCounter)}</h2>`;
        if (block.type === 'callout') return `<div class="doc-callout">${highlightRichText(block.text, query, hitCounter)}</div>`;
        if (block.type === 'table') {
          return `<div class="doc-table-wrap"><table class="doc-table"><thead><tr>${block.headers.map(h => `<th>${highlightRichText(h, query, hitCounter)}</th>`).join('')}</tr></thead><tbody>${block.rows.map(row => `<tr>${row.map(c => `<td>${highlightRichText(c, query, hitCounter)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        }
        if (block.type === 'attachments') {
          return `<div class="space-y-2 my-3">${block.items.map(att => `<div class="doc-attachment" data-open-attachment="${escapeHtml(att.name)}"><div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background:var(--bg-paper); border:0.5px solid var(--hairline)"><i data-lucide="${att.icon || 'file'}" class="w-4 h-4" style="color:var(--accent)"></i></div><div class="min-w-0 flex-1"><div class="text-[13px] font-medium truncate">${highlightRichText(att.name, query, hitCounter)}</div><div class="font-mono-eng text-[11px]" style="color:var(--ink-tertiary)">${escapeHtml(att.meta)}</div></div><span class="text-[11.5px] shrink-0" style="color:var(--accent)">预览</span></div>`).join('')}</div>`;

        return `<p>${highlightRichText(block.text || '', query, hitCounter)}</p>`;
      }).join('');
    }
