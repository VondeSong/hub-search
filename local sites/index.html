            <i data-lucide="star" class="w-3.5 h-3.5 shrink-0"></i>
            <span class="flex-1 truncate text-[12.5px]">跨库收藏夹</span>
            <span class="font-mono-eng text-[10.5px]" style="color:var(--ink-tertiary)">${state.libFavorites.size}</span>
          </button>
          <button class="nav-item ${state.view === 'space' && state.spaceLib === 'topic' ? 'active' : ''}" data-open-special="topic">
            <i data-lucide="layers" class="w-3.5 h-3.5 shrink-0"></i>
            <span class="flex-1 truncate text-[12.5px]">线束专题</span>
            <span class="font-mono-eng text-[10.5px]" style="color:var(--ink-tertiary)">${state.libTopicItems.size}</span>
          </button>
        </div>
      `;

      libEl.querySelectorAll('[data-open-space]').forEach(btn => {
        btn.addEventListener('click', () => {
          const lib = getLib(btn.dataset.openSpace);
          if (lib.browsable) {
            state.view = 'space';
            state.spaceLib = lib.id;
            state.spaceFolderId = 'root-' + lib.id;
            state.spaceSurface = 'split';
            state.spaceFilter = '';
            state.jumpBarOpenKey = null;
            const firstDoc = SPACE_NODES.find(n => n.lib === lib.id && n.kind !== 'folder') || getSpaceChildren(state.spaceFolderId)[0];
            if (firstDoc) {
              state.spaceSelectedCardId = firstDoc.id;
              getSpaceAncestors(firstDoc.id).forEach(a => state.spaceExpandedIds.add(a.id));
            }
            renderAll();
          } else {
            state.view = 'search';
            state.selectedLibraries = new Set([lib.id]);
            showToast(`${lib.short} 为流式收藏，已切至搜索并限定该来源`, 'filter');
            renderAll();
          }
        });
      });

      libEl.querySelectorAll('[data-open-special]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.view = 'space';
          state.spaceLib = btn.dataset.openSpecial;
          state.spaceSurface = 'split';
          state.spaceFilter = '';
          state.jumpBarOpenKey = null;
          const list = getVisibleHierarchyList();
          if (list.length) state.spaceSelectedCardId = list[0].node.id;
          renderAll();
        });
      });

      libEl.querySelectorAll('[data-toggle-lib-scope]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = btn.dataset.toggleLibScope;
          if (state.selectedLibraries.has(id)) {
            if (state.selectedLibraries.size > 1) state.selectedLibraries.delete(id);
            else showToast('至少保留一个检索资料库', 'info');
          } else state.selectedLibraries.add(id);
          renderAll();
        });
      });

      const tagsEl = document.getElementById('sidebar-pinned-tags');
      tagsEl.innerHTML = ['线束', 'hub-search', 'eds', 'sqlite', 'fsrs', 'design'].map(t => `
        <button class="pill-btn text-[11.5px] ${state.searchTag === t && state.view === 'search' ? 'active' : ''}" data-pin-tag="${t}">#${t}</button>
      `).join('');
      tagsEl.querySelectorAll('[data-pin-tag]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tag = btn.dataset.pinTag;
          state.view = 'search';
          state.searchTag = state.searchTag === tag ? null : tag;
          renderAll();
        });
      });
    }

    function renderStatusBar() {
      const el = document.getElementById('status-scope-text');
      if (!el) return;
      if (state.view === 'space') {
        if (state.spaceSurface === 'dual') {
          el.textContent = '双纸并排对照中 · 拖动中间发丝线调宽 · 按 ⌘J 呼出助手一键比对两张纸';
        } else {
          el.textContent = '资料库层级浏览 · ↑↓ 键盘连刷右侧统一预览 · ←→ 折叠展开 · ⌘. 专注阅读 · ⌘+点击并排对照';
        }
      } else {
        el.textContent = `Hub · 全局搜索范围：已选 ${state.selectedLibraries.size}/${LIBRARIES.length} 个资料库 · FTS5 9ms`;
      }
    }

    const quickAssistantPanel = document.getElementById('quick-assistant-panel');
    const quickAssistantFrame = document.getElementById('quick-assistant-frame');
    const agentSource = document.getElementById('quick-assistant-source');
    const assistantCases = document.querySelectorAll('[data-agent-case]');
    const agentDemoBtn = document.getElementById('btn-agent-demo-menu');
    const agentDemoPopover = document.getElementById('agent-demo-popover');
    const agentDemoLabel = document.getElementById('agent-demo-label');
    const agentDemoDot = document.getElementById('agent-demo-dot');
    const assistantCaseMeta = {
      diary: { label: '引用与摘录', dot: '#6366F1' },
      report: { label: '流式复核', dot: '#94A3B8' },
      interrupted: { label: '中断与规则', dot: '#F59E0B' },
      workspace: { label: '当前资料', dot: '#10B981' },
      empty: { label: '新对话', dot: '#94A3B8' }
    };
    const assistantLayouts = { docked: '右侧分屏停靠', floating: '悬浮浮窗', expanded: '专注展开' };

    function setAgentDemoPopover(open) {
      agentDemoPopover.hidden = !open;
      agentDemoBtn.setAttribute('aria-expanded', String(open));
    }

    function syncAgentDemoTrigger(caseKey) {
      const meta = assistantCaseMeta[caseKey] || assistantCaseMeta.diary;
      agentDemoLabel.textContent = '示例：' + meta.label;
      agentDemoDot.style.background = meta.dot;
    }
    let quickAssistantReady = false;
    let quickAssistantRequest = null;
    let lastAssistantContext = '';
    let lastAssistantTrigger = null;
    let lastAssistantView = null;

    function getQuickAssistantContext() {
      const toPaper = (doc, library) => ({ id: doc.id, title: doc.title, snippet: doc.snippet || '', library: getLib(library).short });
      if (state.view === 'space') {
        if (state.spaceSurface === 'dual') {
          const papers = state.readerPapers.map(getSpaceNode).filter(Boolean);
          if (papers.length === 2) return papers.map(paper => toPaper(paper, paper.lib));
        }
        const node = getSpaceNode(state.spaceSelectedCardId);
        if (node) return [toPaper(node, node.lib)];
      }
      const doc = getDoc(state.selectedDocId);
      const subpage = doc.subpages?.find(page => page.id === state.activeSubpageId);
      return [toPaper(subpage || doc, doc.library)];
    }

    function postQuickAssistant(type, payload = {}) {
      quickAssistantFrame.contentWindow.postMessage({ type: 'hub-assistant-' + type, ...payload }, '*');
    }

    function renderQuickAssistant() {
      const fab = document.getElementById('btn-quick-assistant');
      const dedicatedAgent = state.view === 'agents' && isEmbedActive('agents');
      const showPanel = state.quickAssistantOpen && !dedicatedAgent;
      if (state.view !== lastAssistantView) agentSource.hidden = true;
      lastAssistantView = state.view;
      quickAssistantPanel.hidden = !showPanel;
      document.getElementById('quick-assistant-controls').hidden = !showPanel;
      if (!showPanel) setAgentDemoPopover(false);
      document.getElementById('workspace-content').inert = showPanel && quickAssistantPanel.dataset.layout === 'expanded' && agentSource.hidden;
      if (!showPanel) agentSource.hidden = true;
      fab.style.display = showPanel || dedicatedAgent ? 'none' : 'inline-flex';
      fab.setAttribute('aria-expanded', String(showPanel));
      document.getElementById('btn-status-assistant').setAttribute('aria-expanded', String(showPanel));

      const papers = getQuickAssistantContext();
      document.getElementById('qa-fab-label').textContent = papers.length === 2 ? '比对两张纸' : '助手';
      if (!showPanel) return;

      if (!quickAssistantFrame.hasAttribute('src')) quickAssistantFrame.src = 'modules/agents.html?panel=1';
      if (!quickAssistantReady) return;

      const contextKey = JSON.stringify(papers);
      if (contextKey !== lastAssistantContext) {
        postQuickAssistant('context', { papers });
        lastAssistantContext = contextKey;
      }
      if (quickAssistantRequest) {
        const { type, ...payload } = quickAssistantRequest;
        quickAssistantRequest = null;
        postQuickAssistant(type, type === 'ask' ? { ...payload, papers } : payload);
      }
    }

    function openQuickAssistant(request = { type: 'focus' }) {
      if (!state.quickAssistantOpen) lastAssistantTrigger = document.activeElement;
      if (matchMedia('(max-width: 820px)').matches && !state.sidebarCollapsed) {
        state.sidebarCollapsed = true;
        renderChrome();
      }
      quickAssistantRequest = request;
      state.quickAssistantOpen = true;
      renderQuickAssistant();
    }

    function closeQuickAssistant(restoreFocus = false) {
      state.quickAssistantOpen = false;
      quickAssistantRequest = null;
      renderQuickAssistant();
      if (restoreFocus) {
        const trigger = lastAssistantTrigger;
        (trigger instanceof HTMLElement && trigger !== document.body && trigger.getClientRects().length
          ? trigger : document.getElementById('btn-quick-assistant')).focus();
      }
    }

    function toggleQuickAssistant() {
      if (state.view === 'agents' && isEmbedActive('agents')) {
        mountedEmbeds.agents?.contentWindow.postMessage({ type: 'hub-assistant-toggle' }, '*');
        return;
      }
      if (state.quickAssistantOpen) closeQuickAssistant();
      else openQuickAssistant(getQuickAssistantContext().length === 2 ? { type: 'case', value: 'workspace', focus: true } : undefined);
    }

    function showAssistantSource(anchor) {
      const frame = document.getElementById('agent-source-frame');
      const target = 'modules/agents.html?source=1#' + anchor;
      if (frame.getAttribute('src') === target) {
        frame.contentWindow.postMessage({ type: 'hub-assistant-source', anchor }, '*');
      } else {
        frame.src = target;
      }
      agentSource.hidden = false;
      renderQuickAssistant();
      document.getElementById('btn-close-agent-source').focus();
    }

    function receiveQuickAssistant(data) {
      if (data.type === 'hub-assistant-ready') {
        quickAssistantReady = true;
        lastAssistantContext = '';
        renderQuickAssistant();
      } else if (data.type === 'hub-assistant-close') {
        closeQuickAssistant(true);
      } else if (data.type === 'hub-assistant-case-changed') {
        assistantCases.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.agentCase === data.value)));
        syncAgentDemoTrigger(data.value);
      } else if (data.type === 'hub-assistant-layout' && Object.hasOwn(assistantLayouts, data.value)) {
        quickAssistantPanel.dataset.layout = data.value;
        document.getElementById('quick-assistant-layout').textContent = '当前形态：' + assistantLayouts[data.value];
        renderQuickAssistant();
      } else if (data.type === 'hub-assistant-citation' && /^para-(14|17|29)$/.test(data.anchor) && !quickAssistantPanel.hidden) {
        showAssistantSource(data.anchor);
      } else if (data.type === 'hub-assistant-save' && typeof data.text === 'string' && typeof data.title === 'string') {
        const id = Date.now();
        if (data.target === 'journal') {
          state.journals[0].entries.unshift({
            id: 'j-' + id,
            time: new Date().toTimeString().slice(0, 5),
            text: '[助手摘录] ' + data.text.replace(/\n+/g, ' '),
            tags: ['assistant', 'daily']
          });
          showToast('已将助手结论写入原型的今日日志', 'calendar-days');
        } else if (data.target === 'task') {
          state.tasks.unshift({
            id: 't-' + id, title: data.title, bucket: 'today', priority: 'medium',
            source: '本地', due: '今天', tags: ['assistant'], done: false, notes: data.text
          });
          showToast('已将结论转为原型的今日任务', 'list-plus');
        }
        if (state.view === 'journals' || state.view === 'tasks') renderMain();
        renderChrome();
      }
    }

    // =========================================================================
    // LIBRARY WORKSPACE: HIERARCHY TREE + SHARED PREVIEW + JUMP BAR + DUAL PAPER
    // =========================================================================

    function renderJumpBarHtml(paneKey, nodeOrFolderId, isCanvas = false) {
      const node = getSpaceNode(nodeOrFolderId);
      const libId = node ? node.lib : state.spaceLib;
      const isSpecial = libId === 'favorites' || libId === 'topic';
      if (isSpecial) {
        return `<span class="text-[12.5px] font-medium" style="color:var(--ink-primary)">${libId === 'favorites' ? '跨库收藏夹' : '线束专题'}</span>`;
      }

      const lib = getLib(libId);
      const rootId = 'root-' + libId;
      const chain = node ? getSpaceAncestors(node.id) : [];

      const renderSegment = (segKey, label, siblings, currentId, isRoot = false) => {
        const isOpen = state.jumpBarOpenKey === segKey;
        return `
          <div class="relative inline-flex items-center">
            <button class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[12px] transition-colors cursor-pointer ${isOpen ? 'active' : 'hover:bg-black/5'}" data-jump-toggle="${segKey}" title="${escapeHtml(label)}" style="color:${isOpen ? 'var(--accent)' : isRoot ? 'var(--ink-secondary)' : 'var(--ink-primary)'}; font-weight:${isRoot ? '500' : '550'}">
              ${isRoot ? `<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${lib.color}"></span>` : ''}
              <span class="max-w-[160px] truncate">${escapeHtml(label)}</span>
              <i data-lucide="chevron-down" class="w-3 h-3 opacity-60 shrink-0"></i>
            </button>
            ${isOpen ? `
              <div class="jump-bar-menu animate-view">
                <div class="px-2 py-1 text-[10.5px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">
                  ${isRoot ? '切换资料库空间或根目录' : '切换同级项 / 子页面'}
                </div>
                ${isRoot ? `
                  <button class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left text-[12.5px] hover:bg-black/5 cursor-pointer" data-jump-canvas-root="${libId}">
                    <i data-lucide="folder-tree" class="w-3.5 h-3.5" style="color:var(--accent)"></i>
                    <span class="font-medium">回到「${lib.short}」根目录</span>
                  </button>
                  <div class="my-1 hairline-t"></div>
                ` : ''}
                ${siblings.map(sib => `
                  <button class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left text-[12.5px] cursor-pointer ${sib.id === currentId ? '' : 'hover:bg-black/5'}" data-jump-pick="${paneKey}|${sib.id}" style="background:${sib.id === currentId ? 'var(--bg-active)' : 'transparent'}; color:${sib.id === currentId ? 'var(--accent)' : 'var(--ink-primary)'}">
                    <i data-lucide="${getNodeIcon(sib.kind)}" class="w-3.5 h-3.5 shrink-0 opacity-75"></i>
                    <span class="flex-1 truncate">${escapeHtml(sib.title)}</span>
                    <span class="font-mono-eng text-[10px] shrink-0" style="color:var(--ink-tertiary)">${getNodeKindLabel(sib.kind)}</span>
                  </button>
                `).join('')}
                ${isRoot ? `
                  <div class="my-1.5 hairline-t"></div>
                  <div class="px-2 py-1 text-[10.5px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">切换其他资料库</div>
                  ${LIBRARIES.filter(l => l.browsable && l.id !== libId).map(other => `
                    <button class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left text-[12px] hover:bg-black/5 cursor-pointer" data-jump-switch-lib="${other.id}">
                      <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${other.color}"></span>
                      <span class="flex-1 truncate font-medium">${escapeHtml(other.name)}</span>
                      <span class="font-mono-eng text-[10px]" style="color:var(--ink-tertiary)">${other.count}</span>
                    </button>
                  `).join('')}
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;
      };

      let html = renderSegment(`${paneKey}:root`, lib.name, getSpaceChildren(rootId), chain[0]?.id || '', true);
      chain.forEach((seg, idx) => {
        const parentId = idx === 0 ? rootId : chain[idx - 1].id;
        const siblings = getSpaceChildren(parentId);
        html += `<span class="text-[11px] opacity-40">/</span>`;
        html += renderSegment(`${paneKey}:${seg.id}`, seg.title, siblings, seg.id, false);
      });

      if (!isCanvas && node) {
        const subs = getSpaceChildren(node.id);
        if (subs.length > 0) {
          const subKey = `${paneKey}:subs`;
          const isOpen = state.jumpBarOpenKey === subKey;
          html += `
            <span class="text-[11px] opacity-40">/</span>
            <div class="relative inline-flex items-center">
              <button class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] cursor-pointer" data-jump-toggle="${subKey}" title="${subs.length} 篇子页面" style="background:var(--accent-soft); color:var(--accent)">
                <span>${subs.length} 篇子页面</span>
                <i data-lucide="chevron-down" class="w-3 h-3"></i>
              </button>
              ${isOpen ? `
                <div class="jump-bar-menu animate-view">
                  <div class="px-2 py-1 text-[10.5px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">直达下级子页面</div>
                  ${subs.map(s => `
                    <button class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left text-[12.5px] hover:bg-black/5 cursor-pointer" data-jump-pick="${paneKey}|${s.id}">
                      <i data-lucide="file-symlink" class="w-3.5 h-3.5 shrink-0" style="color:var(--accent)"></i>
                      <span class="truncate">${escapeHtml(s.title)}</span>
                    </button>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }
      }
      return html;
    }

    function renderCardMiniSkeleton(node) {
      const subCount = getSpaceChildren(node.id).length;
      if (node.kind === 'folder') {
        const kids = getSpaceChildren(node.id);
        return `
          <div class="mini-preview-box space-y-1.5">
            ${kids.slice(0, 3).map(k => `
              <div class="flex items-center gap-1.5 truncate">
                <i data-lucide="${getNodeIcon(k.kind)}" class="w-3 h-3 shrink-0" style="color:var(--ink-tertiary)"></i>
                <span class="truncate" style="color:var(--ink-primary)">${escapeHtml(k.title)}</span>
              </div>
            `).join('') || `<span style="color:var(--ink-muted)">空文件夹</span>`}
          </div>
        `;
      }

      if (node.previewType === 'table' && node.previewMeta) {
        return `
          <div class="mini-preview-box space-y-1 font-mono-eng text-[10.5px]">
            <div class="flex items-center justify-between pb-1 hairline-b" style="color:var(--ink-tertiary)">
              <span>${node.kind === 'sheet' ? '多维表格字段' : '内含参数对照表'}</span>
              ${subCount ? `<span style="color:var(--accent)">+${subCount} 子页</span>` : ''}
            </div>
            ${node.previewMeta.slice(0, 2).map(m => `<div class="truncate" style="color:var(--ink-secondary)">· ${escapeHtml(m)}</div>`).join('')}
          </div>
        `;
      }

      if (node.previewType === 'callout' && node.previewMeta) {
        return `
          <div class="mini-preview-box space-y-1" style="border-left:2px solid var(--accent)">
            ${node.previewMeta.map(m => `<div class="truncate font-medium" style="color:var(--ink-primary)">${escapeHtml(m)}</div>`).join('')}
          </div>
        `;
      }

      return `
        <div class="mini-preview-box">
          <div class="line-clamp-2 leading-relaxed" style="color:var(--ink-secondary)">${escapeHtml(node.snippet || '')}</div>
        </div>
      `;
    }

    function renderSinglePaperSheet(nodeId, paneIndex, totalPapers) {
      const node = getSpaceNode(nodeId);
      if (!node) return '';
      const lib = getLib(node.lib);
      const subs = getSpaceChildren(node.id);
      const paneKey = `pane-${paneIndex}`;
      const pickerKey = `picker-${paneIndex}`;
      const pickerOpen = state.jumpBarOpenKey === pickerKey;
      const allDocs = SPACE_NODES.filter(n => n.kind !== 'folder');
      const isDual = totalPapers === 2;
      const isFolder = node.kind === 'folder';
      const dualIdAttr = isDual ? (paneIndex === 0 ? 'id="dual-left-pane"' : 'id="dual-right-pane"') : '';
      const dualWidthStyle = isDual && paneIndex === 0 ? `style="width:${state.dualSplitPercent}%; flex:none; min-width:280px;"` : '';

      return `
        <div ${dualIdAttr} ${dualWidthStyle} class="${isDual && paneIndex === 0 ? '' : 'flex-1'} min-w-0 h-full flex flex-col overflow-hidden ${isDual ? 'paper-sheet' : ''}">
          <!-- Single Unified Paper Header -->
          <div class="px-4 py-2 hairline-b flex items-center justify-between gap-2 shrink-0 relative z-20" style="background:rgba(255,255,255,0.92); backdrop-filter:blur(16px)">
            <div class="paper-breadcrumbs flex items-center gap-1 min-w-0">
              ${!isDual ? `
                <button id="btn-toggle-focus-reader" class="icon-btn mr-0.5 ${state.spaceFocusReader ? 'active' : ''}" title="${state.spaceFocusReader ? '恢复左侧层级树 (⌘.)' : '专注阅读（收起层级树 ⌘.）'}">
                  <i data-lucide="${state.spaceFocusReader ? 'panel-left-open' : 'maximize-2'}" class="w-3.5 h-3.5"></i>
                </button>
              ` : paneIndex === 0 ? `
                <button id="btn-back-to-split" class="icon-btn mr-0.5" title="返回层级列表与预览">
                  <i data-lucide="panel-left" class="w-4 h-4"></i>
                </button>
              ` : `
                <span class="px-1.5 py-0.5 rounded font-mono-eng text-[10px] mr-1 shrink-0" style="background:var(--accent-soft); color:var(--accent)">对照纸</span>
              `}
              ${renderJumpBarHtml(paneKey, node.id, false)}
            </div>

            <div class="flex items-center gap-1 shrink-0 relative">
              <div class="relative">
                <button class="pill-btn text-[11.5px] ${isDual && paneIndex === 1 ? 'active' : ''}" data-jump-toggle="${pickerKey}" title="${!isDual ? '在右侧摊开第二张白纸并排对照' : '更换当前纸面为任意库的文档'}">
                  <i data-lucide="${!isDual ? 'columns-2' : 'arrow-left-right'}" class="w-3 h-3"></i>
                  <span>${!isDual ? '并排对照' : '换一张纸'}</span>
                </button>
                ${pickerOpen ? `
                  <div class="jump-bar-menu animate-view" style="left:auto; right:0; width:280px">
                    <div class="px-2 py-1 text-[10.5px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">
                      ${!isDual ? '选择任意库文档摊开到右侧对照' : '替换当前纸面内容'}
                    </div>
                    ${allDocs.map(d => {
                      const dl = getLib(d.lib);
                      const isUsed = isDual ? state.readerPapers.includes(d.id) : d.id === node.id;
                      return `
                        <button class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left text-[12px] hover:bg-black/5 cursor-pointer" data-assign-paper="${!isDual ? 1 : paneIndex}|${d.id}" style="opacity:${isUsed ? '0.55' : '1'}">
                          <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${dl.color}"></span>
                          <span class="flex-1 truncate font-medium">${escapeHtml(d.title)}</span>
                          <span class="font-mono-eng text-[10px] shrink-0" style="color:var(--ink-tertiary)">${dl.short}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                ` : ''}
              </div>

              ${!isDual ? `
                <button class="icon-btn ${state.libTopicItems.has(node.id) ? 'active' : ''}" data-space-topic="${node.id}" title="${state.libTopicItems.has(node.id) ? '移出线束专题' : '加入线束专题'}">
                  <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                </button>
                <button class="icon-btn ${state.libFavorites.has(node.id) ? 'active' : ''}" data-space-fav="${node.id}" title="收藏">
                  <i data-lucide="star" class="w-3.5 h-3.5"></i>
                </button>
                <button class="pill-btn text-[11.5px]" data-paper-ask-qa="1" title="在右侧快捷助手中围绕本篇提问">
                  <i data-lucide="sparkles" class="w-3 h-3" style="color:var(--accent)"></i> 问助手
                </button>
              ` : `
                <button class="icon-btn" data-close-paper="${paneIndex}" title="收起这张纸">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              `}
            </div>
          </div>

          <!-- Shared Elevated White Paper Scroll Area -->
          <div class="flex-1 overflow-y-auto ${isDual ? 'p-5 lg:p-7' : 'p-4 lg:p-6'} pb-16 select-text" style="background:${isDual ? 'var(--bg-paper)' : 'var(--bg-surface)'}">
            <article class="${isDual ? 'max-w-[68ch] mx-auto' : 'paper-sheet p-6 lg:p-10 mx-auto max-w-[780px]'}">
              <div class="flex items-center justify-between gap-2 mb-3 text-[11.5px]" style="color:var(--ink-tertiary)">
                <span class="inline-flex items-center gap-1.5 font-medium" style="color:var(--ink-secondary)">
                  <span class="w-1.5 h-1.5 rounded-full" style="background:${lib.color}"></span>
                  ${lib.name} · ${getNodeKindLabel(node.kind)}
                </span>
                <span class="font-mono-eng">更新于 ${node.updated}</span>
              </div>

              <h1 class="text-[22px] font-semibold tracking-tight leading-snug mb-3 ${state.serifReading ? 'font-reading-serif' : ''}">${escapeHtml(node.title)}</h1>

              ${isFolder ? `
                <p class="text-[13.5px] mb-6 leading-relaxed" style="color:var(--ink-secondary)">${escapeHtml(node.snippet || '')}</p>
                <div class="flex items-center justify-between mb-3 text-[11px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">
                  <span>空间内文档与子目录 (${subs.length})</span>
                  <span class="font-normal normal-case">点击阅读 · ⌘+点击并排对照</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                  ${subs.map(s => {
                    const sl = getLib(s.lib);
                    const sKids = getSpaceChildren(s.id).length;
                    return `
                      <div class="space-card group p-4 flex flex-col justify-between gap-2.5 ${s.kind === 'folder' ? 'folder-stack mt-1.5' : ''}" data-assign-paper="${isDual ? paneIndex : 0}|${s.id}">
                        <div class="space-y-2">
                          <div class="flex items-center justify-between gap-2">
                            <span class="inline-flex items-center gap-1.5 text-[11px] font-medium" style="color:var(--ink-secondary)">
                              <i data-lucide="${getNodeIcon(s.kind)}" class="w-3.5 h-3.5" style="color:${s.kind === 'folder' ? 'var(--accent)' : sl.color}"></i>
                              <span>${getNodeKindLabel(s.kind)}</span>
                              ${sKids ? `<span class="font-mono-eng opacity-70">· ${sKids} 项</span>` : ''}
                            </span>
                            ${s.kind !== 'folder' ? `<button class="hover-reveal pill-btn !py-0.5 !px-2 text-[10.5px]" data-open-dual="${s.id}" title="并排对照打开">并排</button>` : ''}
                          </div>
                          <div class="text-[14px] font-semibold leading-snug">${escapeHtml(s.title)}</div>
                          ${renderCardMiniSkeleton(s)}
                        </div>
                        <div class="flex items-center justify-between text-[10.5px] font-mono-eng pt-1" style="color:var(--ink-tertiary)">
                          <span>${s.updated}</span>
                          <span>点击进入 →</span>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : `
                ${node.toc && node.toc.length ? `
                  <nav class="doc-toc mt-4">
                    <div class="text-[11px] font-semibold uppercase tracking-wider mb-1.5" style="color:var(--ink-tertiary)">本页目录</div>
                    <ul class="m-0 p-0 list-none space-y-1">
                      ${node.toc.map(t => `<li><button class="text-[12.5px] hover:underline cursor-pointer" style="color:var(--ink-secondary)" data-toc-jump="${t.id}">${escapeHtml(t.label)}</button></li>`).join('')}
                    </ul>
                  </nav>
                ` : ''}

                <div class="reading-prose text-[14.5px] mt-4 ${state.serifReading ? 'font-reading-serif' : ''}">
                  ${renderDocumentBlocks(node, '', null)}
                </div>

                ${subs.length > 0 ? `
                  <div class="mt-7 pt-5 hairline-t space-y-2">
                    <div class="text-[11px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">下级子页面 (${subs.length})</div>
                    <div class="inset-group">
                      ${subs.map(s => `
                        <div class="inset-row px-3.5 py-2.5 flex items-center justify-between gap-2">
                          <button class="flex-1 min-w-0 flex items-center gap-2.5 text-left cursor-pointer" data-assign-paper="${isDual ? paneIndex : 0}|${s.id}">
                            <i data-lucide="${getNodeIcon(s.kind)}" class="w-4 h-4 shrink-0" style="color:var(--ink-tertiary)"></i>
                            <div class="min-w-0">
                              <div class="text-[13px] font-medium truncate">${escapeHtml(s.title)}</div>
                              <div class="text-[11.5px] truncate" style="color:var(--ink-tertiary)">${escapeHtml(s.snippet)}</div>
                            </div>
                          </button>
                          <button class="pill-btn text-[11px] shrink-0" data-open-dual="${s.id}" title="在右侧并排对照打开">并排</button>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}

                ${node.wikilinks && node.wikilinks.length ? `
                  <div class="mt-6 pt-4 hairline-t flex items-center gap-2 flex-wrap">
                    <span class="text-[11.5px]" style="color:var(--ink-tertiary)">Obsidian 双链：</span>
                    ${node.wikilinks.map(wl => `
                      <button class="pill-btn text-[11.5px]" style="color:var(--accent)" data-open-dual="${wl.targetId}" title="点击在右侧并排摊开对照">[[ ${escapeHtml(wl.label)} ]] · 并排</button>
                    `).join('')}
                  </div>
                ` : ''}
              `}
            </article>
          </div>
        </div>
      `;
    }

    function renderSpaceView(stage) {
      if (state.spaceSurface === 'dual') {
        stage.innerHTML = `
          <div class="flex flex-col h-full animate-view" style="background:var(--bg-surface)">
            <div class="px-4 py-1.5 hairline-b flex items-center justify-between gap-2 text-[11.5px] shrink-0" style="background:rgba(255,255,255,0.85); color:var(--ink-secondary)">
              <span class="flex items-center gap-1.5 font-medium">
                <i data-lucide="columns-2" class="w-3.5 h-3.5" style="color:var(--accent)"></i>
                双白纸并排对照 · 拖动中间发丝线可自由调宽
              </span>
              <div class="flex items-center gap-2">
                <button id="btn-dual-swap" class="pill-btn !py-0.5 text-[11px]" title="互换左右两张白纸位置">
                  <i data-lucide="arrow-left-right" class="w-3 h-3"></i> 左右互换
                </button>
                <button id="btn-dual-ask-ai" class="primary-btn px-2.5 py-0.5 text-[11px]">
                  <i data-lucide="sparkles" class="w-3 h-3"></i> 让助手对比这两张纸
                </button>
              </div>
            </div>

            <div id="dual-split-wrap" class="flex-1 flex min-h-0 overflow-hidden gap-1.5 p-3">
              ${renderSinglePaperSheet(state.readerPapers[0], 0, 2)}
              <div id="dual-resizer" class="split-resizer" title="拖拽调整左右白纸比例 (30%–70%)"></div>
              ${renderSinglePaperSheet(state.readerPapers[1], 1, 2)}
            </div>
          </div>
        `;
      } else {
        const visibleList = getVisibleHierarchyList();
        const isSpecial = state.spaceLib === 'favorites' || state.spaceLib === 'topic';
        const lib = isSpecial ? null : getLib(state.spaceLib);

        if (visibleList.length && !visibleList.some(x => x.node.id === state.spaceSelectedCardId)) {
          state.spaceSelectedCardId = visibleList[0].node.id;
        }
        const selectedNode = getSpaceNode(state.spaceSelectedCardId);

        stage.innerHTML = `
          <div id="space-split-wrap" class="flex-1 flex min-h-0 overflow-hidden animate-view">
            ${!state.spaceFocusReader ? `
              <div id="space-list-pane" class="flex flex-col shrink-0 overflow-hidden" style="width:${state.spaceSplitPercent}%; min-width:248px; max-width:48%; background:rgba(250, 250, 252, 0.72)">
                <div class="px-3.5 pt-3 pb-2.5 space-y-2.5 shrink-0 hairline-b">
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                      ${!isSpecial ? `<span class="w-2 h-2 rounded-full shrink-0" style="background:${lib.color}"></span>` : `<i data-lucide="${state.spaceLib === 'favorites' ? 'star' : 'layers'}" class="w-3.5 h-3.5 shrink-0" style="color:var(--accent)"></i>`}
                      <span class="text-[13px] font-semibold truncate">${isSpecial ? (state.spaceLib === 'favorites' ? '跨库收藏夹' : '线束专题') : lib.name}</span>
                      <span class="font-mono-eng text-[10.5px]" style="color:var(--ink-tertiary)">${visibleList.length}</span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                      ${state.spaceBrowseMode === 'tree' && !isSpecial ? `
                        <button id="btn-toggle-expand-all" class="icon-btn !w-6 !h-6" title="${state.spaceExpandedIds.size > 0 ? '全部折叠' : '全部展开'}">
                          <i data-lucide="${state.spaceExpandedIds.size > 0 ? 'fold-vertical' : 'unfold-vertical'}" class="w-3.5 h-3.5"></i>
                        </button>
                      ` : ''}
                      <div class="inline-flex items-center p-0.5 rounded-md" style="background:var(--bg-subtle)">
                        <button class="px-2 py-0.5 rounded text-[11px] cursor-pointer ${state.spaceBrowseMode === 'tree' ? 'font-medium' : ''}" data-space-mode="tree" style="background:${state.spaceBrowseMode === 'tree' ? 'var(--bg-paper)' : 'transparent'}; color:${state.spaceBrowseMode === 'tree' ? 'var(--ink-primary)' : 'var(--ink-tertiary)'}">层级</button>
                        <button class="px-2 py-0.5 rounded text-[11px] cursor-pointer ${state.spaceBrowseMode === 'cards' ? 'font-medium' : ''}" data-space-mode="cards" style="background:${state.spaceBrowseMode === 'cards' ? 'var(--bg-paper)' : 'transparent'}; color:${state.spaceBrowseMode === 'cards' ? 'var(--ink-primary)' : 'var(--ink-tertiary)'}">卡片</button>
                      </div>
                    </div>
                  </div>

                  <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg" style="background:var(--bg-paper); border:0.5px solid var(--hairline)">
                    <i data-lucide="search" class="w-3 h-3 shrink-0" style="color:var(--ink-tertiary)"></i>
                    <input id="space-filter-input" type="text" value="${escapeHtml(state.spaceFilter)}" placeholder="筛选当前库目录..." class="w-full bg-transparent outline-none text-[12px]" />
                    ${state.spaceFilter ? `<button id="btn-clear-space-filter" class="cursor-pointer" style="color:var(--ink-tertiary)"><i data-lucide="x" class="w-3 h-3"></i></button>` : ''}
                  </div>
                </div>

                <div class="flex-1 overflow-y-auto px-2 py-2.5">
                  ${visibleList.length === 0 ? `
                    <div class="p-8 text-center text-[12.5px]" style="color:var(--ink-tertiary)">暂无匹配条目</div>
                  ` : state.spaceBrowseMode === 'tree' ? `
                    <div class="space-y-0.5">
                      ${visibleList.map(({ node, depth }) => {
                        const nl = getLib(node.lib);
                        const kids = getSpaceChildren(node.id);
                        const hasKids = kids.length > 0;
                        const expanded = state.spaceExpandedIds.has(node.id);
                        const isSel = node.id === state.spaceSelectedCardId;
                        const isFav = state.libFavorites.has(node.id);
                        const isTopic = state.libTopicItems.has(node.id);
                        const filterQ = state.spaceFilter.trim();
                        const ancestorPath = filterQ
                          ? getSpaceAncestors(node.id).slice(0, -1).map(a => a.title).join(' / ')
                          : '';
                        const guideLines = Array.from({ length: depth }, (_, lvl) =>
                          `<span class="tree-guide-line" style="left:${10 + lvl * 18 + 7}px"></span>`
                        ).join('');

                        return `
                          <div class="tree-row group ${isSel ? 'selected' : ''}" data-space-row="${node.id}" style="padding-left:${10 + depth * 18}px">
                            ${guideLines}
                            <span class="tree-row-accent"></span>
                            <button class="w-4 h-5 flex items-center justify-center shrink-0 cursor-pointer rounded hover:bg-black/5" data-tree-chevron="${node.id}" style="visibility:${hasKids ? 'visible' : 'hidden'}; color:var(--ink-tertiary)" title="${expanded ? '折叠' : '展开'}">
                              <i data-lucide="${expanded ? 'chevron-down' : 'chevron-right'}" class="w-3 h-3"></i>
                            </button>

                            <i data-lucide="${node.kind === 'folder' && expanded ? 'folder-open' : getNodeIcon(node.kind)}" class="w-3.5 h-3.5 shrink-0" style="color:${isSel ? 'var(--accent)' : node.kind === 'folder' ? 'var(--ink-tertiary)' : nl.color}"></i>

                            <div class="flex-1 min-w-0">
                              <div class="text-[12.5px] truncate ${node.kind === 'folder' ? 'font-medium' : ''}">${highlightSnippet(node.title, filterQ)}</div>
                              ${ancestorPath ? `<div class="text-[10px] truncate" style="color:var(--ink-tertiary)">${escapeHtml(ancestorPath)}</div>` : ''}
                            </div>

                            ${hasKids && !expanded ? `<span class="font-mono-eng text-[10px] px-1.5 rounded-full shrink-0" style="background:var(--bg-subtle); color:var(--ink-tertiary)">${kids.length}</span>` : ''}

                            <div class="flex items-center gap-0.5 shrink-0">
                              ${node.kind !== 'folder' ? `
                                <button class="hover-reveal icon-btn !w-5 !h-5" data-open-dual="${node.id}" title="并排对照 (⌘+点击)">
                                  <i data-lucide="columns-2" class="w-3 h-3"></i>
                                </button>
                              ` : ''}
                              <button class="hover-reveal icon-btn !w-5 !h-5 ${isTopic ? '!opacity-100 active' : ''}" data-space-topic="${node.id}" title="${isTopic ? '移出线束专题' : '加入线束专题'}">
                                <i data-lucide="layers" class="w-3 h-3"></i>
                              </button>
                              <button class="hover-reveal icon-btn !w-5 !h-5 ${isFav ? '!opacity-100 active' : ''}" data-space-fav="${node.id}" title="收藏">
                                <i data-lucide="star" class="w-3 h-3"></i>
                              </button>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  ` : `
                    <div class="space-y-2.5 px-1">
                      ${visibleList.map(({ node, depth }) => {
                        const nl = getLib(node.lib);
                        const isSel = node.id === state.spaceSelectedCardId;
                        const kids = getSpaceChildren(node.id);
                        const isFav = state.libFavorites.has(node.id);
                        const isTopic = state.libTopicItems.has(node.id);
                        const filterQ = state.spaceFilter.trim();
                        return `
                          <article class="space-card group p-3 flex flex-col gap-1.5 ${isSel ? 'selected' : ''}" data-space-row="${node.id}" style="margin-left:${depth * 12}px">
                            <div class="flex items-center justify-between gap-2">
                              <span class="inline-flex items-center gap-1.5 text-[11px] font-medium" style="color:var(--ink-secondary)">
                                <i data-lucide="${getNodeIcon(node.kind)}" class="w-3.5 h-3.5" style="color:${node.kind === 'folder' ? 'var(--accent)' : nl.color}"></i>
                                <span>${isSpecial ? nl.short + ' · ' : ''}${getNodeKindLabel(node.kind)}</span>
                                ${kids.length ? `<span class="font-mono-eng opacity-70">(${kids.length})</span>` : ''}
                              </span>
                              <div class="flex items-center gap-0.5">
                                ${node.kind !== 'folder' ? `<button class="hover-reveal icon-btn !w-5 !h-5" data-open-dual="${node.id}" title="并排对照"><i data-lucide="columns-2" class="w-3 h-3"></i></button>` : ''}
                                <button class="hover-reveal icon-btn !w-5 !h-5 ${isTopic ? '!opacity-100 active' : ''}" data-space-topic="${node.id}" title="${isTopic ? '移出线束专题' : '加入线束专题'}"><i data-lucide="layers" class="w-3 h-3"></i></button>
                                <button class="hover-reveal icon-btn !w-5 !h-5 ${isFav ? '!opacity-100 active' : ''}" data-space-fav="${node.id}" title="收藏"><i data-lucide="star" class="w-3 h-3"></i></button>
                              </div>
                            </div>
                            <div class="text-[13px] font-semibold leading-snug">${highlightSnippet(node.title, filterQ)}</div>
                            ${renderCardMiniSkeleton(node)}
                          </article>
                        `;
                      }).join('')}
                    </div>
                  `}
                </div>
              </div>

              <div id="space-resizer" class="split-resizer" title="拖拽调整层级树与右侧预览比例"></div>
            ` : ''}

            <div class="flex-1 min-w-0 h-full overflow-hidden flex flex-col">
              ${selectedNode ? renderSinglePaperSheet(selectedNode.id, 0, 1) : `
                <div class="flex-1 flex flex-col items-center justify-center text-center gap-2" style="color:var(--ink-tertiary)">
                  <i data-lucide="file-text" class="w-7 h-7 opacity-40"></i>
                  <div class="text-[13px]">从左侧层级结构选择任意文档即可在此实时预览</div>
                </div>
              `}
            </div>
          </div>
        `;
      }

      // Bind Space View Events
      stage.querySelectorAll('[data-jump-toggle]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const key = btn.dataset.jumpToggle;
          state.jumpBarOpenKey = state.jumpBarOpenKey === key ? null : key;
          renderMain();
        });
      });

      stage.querySelectorAll('[data-jump-canvas-root]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          state.spaceLib = btn.dataset.jumpCanvasRoot;
          state.spaceFolderId = 'root-' + state.spaceLib;
          state.spaceSurface = 'split';
          state.jumpBarOpenKey = null;
          renderAll();
        });
      });

      stage.querySelectorAll('[data-jump-switch-lib]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const nextLibId = btn.dataset.jumpSwitchLib;
          state.spaceLib = nextLibId;
          state.spaceFolderId = 'root-' + nextLibId;
          state.spaceSurface = 'split';
          state.spaceFilter = '';
          state.jumpBarOpenKey = null;
          const firstDoc = SPACE_NODES.find(n => n.lib === nextLibId && n.kind !== 'folder') || getSpaceChildren(state.spaceFolderId)[0];
          if (firstDoc) {
            state.spaceSelectedCardId = firstDoc.id;
            getSpaceAncestors(firstDoc.id).forEach(a => state.spaceExpandedIds.add(a.id));
          }
          renderAll();
        });
      });

      stage.querySelectorAll('[data-jump-pick]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const [paneKey, targetId] = btn.dataset.jumpPick.split('|');
          state.jumpBarOpenKey = null;
          const node = getSpaceNode(targetId);
          if (!node) return;
          if (state.spaceSurface === 'dual' && paneKey.startsWith('pane-')) {
            const idx = Number(paneKey.replace('pane-', '')) || 0;
            state.readerPapers[idx] = targetId;
            renderAll();
          } else {
            openPaperInSpace(targetId, false);
          }
        });
      });

      stage.querySelectorAll('[data-assign-paper]').forEach(btn => {
        btn.addEventListener('click', e => {
          if (e.target.closest('[data-open-dual]')) return;
          e.stopPropagation();
          const [idxStr, targetId] = btn.dataset.assignPaper.split('|');
          const idx = Number(idxStr);
          const targetNode = getSpaceNode(targetId);
          state.jumpBarOpenKey = null;
          if ((e.metaKey || e.ctrlKey) && targetNode && targetNode.kind !== 'folder') {
            openPaperInSpace(targetId, true);
            return;
          }
          if (idx === 1) {
            openPaperInSpace(targetId, true);
          } else if (state.spaceSurface === 'dual') {
            state.readerPapers[0] = targetId;
            renderAll();
          } else {
            openPaperInSpace(targetId, false);
          }
        });
      });

      document.getElementById('btn-toggle-focus-reader')?.addEventListener('click', () => {
        state.spaceFocusReader = !state.spaceFocusReader;
        renderMain();
      });

      document.getElementById('btn-back-to-split')?.addEventListener('click', () => {
        state.spaceSurface = 'split';
        if (state.readerPapers[0]) state.spaceSelectedCardId = state.readerPapers[0];
        renderAll();
      });

      stage.querySelectorAll('[data-close-paper]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.closePaper);
          const remaining = state.readerPapers[idx === 0 ? 1 : 0] || state.readerPapers[0];
          state.spaceSurface = 'split';
          if (remaining) state.spaceSelectedCardId = remaining;
          renderAll();
        });
      });

      document.getElementById('btn-dual-swap')?.addEventListener('click', () => {
        if (state.readerPapers.length === 2) {
          state.readerPapers = [state.readerPapers[1], state.readerPapers[0]];
          showToast('已互换左右白纸位置', 'arrow-left-right');
          renderAll();
        }
      });

      document.getElementById('btn-dual-ask-ai')?.addEventListener('click', () => {
        openQuickAssistant({ type: 'ask', prompt: '对比当前左右两张纸的核心差异与版本条件' });
      });

      const dualResizer = document.getElementById('dual-resizer');
      const dualWrap = document.getElementById('dual-split-wrap');
      const dualLeft = document.getElementById('dual-left-pane');
      if (dualResizer && dualWrap && dualLeft) {
        dualResizer.addEventListener('pointerdown', () => {
          dualResizer.classList.add('dragging');
          const onMove = ev => {
            const rect = dualWrap.getBoundingClientRect();
            const pct = Math.min(70, Math.max(30, ((ev.clientX - rect.left) / rect.width) * 100));
            state.dualSplitPercent = pct;
            dualLeft.style.width = pct + '%';
          };
          const onUp = () => {
            dualResizer.classList.remove('dragging');
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
          };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      }

      stage.querySelectorAll('[data-paper-ask-qa]').forEach(btn => {
        btn.addEventListener('click', () => {
          openQuickAssistant({ type: 'case', value: 'workspace', focus: true });
        });
      });

      stage.querySelectorAll('[data-space-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.spaceBrowseMode = btn.dataset.spaceMode;
          renderAll();
        });
      });

      document.getElementById('btn-toggle-expand-all')?.addEventListener('click', () => {
        if (state.spaceExpandedIds.size > 0) {
          state.spaceExpandedIds.clear();
        } else {
          SPACE_NODES.forEach(n => { if (getSpaceChildren(n.id).length > 0) state.spaceExpandedIds.add(n.id); });
        }
        renderMain();
      });

      const spaceFilter = document.getElementById('space-filter-input');
      if (spaceFilter) {
        spaceFilter.addEventListener('input', e => {
          state.spaceFilter = e.target.value;
          const pos = spaceFilter.selectionStart;
          renderMain();
          const ni = document.getElementById('space-filter-input');
          if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
        });
      }

      document.getElementById('btn-clear-space-filter')?.addEventListener('click', () => {
        state.spaceFilter = '';
        renderMain();
      });

      stage.querySelectorAll('[data-tree-chevron]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = btn.dataset.treeChevron;
          if (state.spaceExpandedIds.has(id)) state.spaceExpandedIds.delete(id);
          else state.spaceExpandedIds.add(id);
          renderMain();
        });
      });

      stage.querySelectorAll('[data-space-row]').forEach(row => {
        row.addEventListener('click', e => {
          if (e.target.closest('button')) return;
          const id = row.dataset.spaceRow;
          const node = getSpaceNode(id);
          if (!node) return;
          if (e.metaKey || e.ctrlKey) {
            openPaperInSpace(id, node.kind !== 'folder');
            return;
          }
          state.spaceSelectedCardId = id;
          if (node.kind === 'folder' && !state.spaceExpandedIds.has(id)) {
            state.spaceExpandedIds.add(id);
          }
          renderAll();
        });
      });

      stage.querySelectorAll('[data-open-dual]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          openPaperInSpace(btn.dataset.openDual, true);
        });
      });

      stage.querySelectorAll('[data-space-topic]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = btn.dataset.spaceTopic;
          if (state.libTopicItems.has(id)) {
            state.libTopicItems.delete(id);
            showToast('已移出线束专题', 'layers');
          } else {
            state.libTopicItems.add(id);
            showToast('已加入线束专题（不移动原文件）', 'layers');
          }
          renderAll();
        });
      });

      stage.querySelectorAll('[data-space-fav]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = btn.dataset.spaceFav;
          if (state.libFavorites.has(id)) { state.libFavorites.delete(id); showToast('已移出收藏', 'star'); }
          else { state.libFavorites.add(id); showToast('已加入跨库收藏夹', 'star'); }
          renderAll();
        });
      });

      stage.querySelectorAll('[data-toc-jump]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.tocJump)?.scrollIntoView({ behavior: 'smooth', block: 'start' })));
      stage.querySelectorAll('[data-open-attachment]').forEach(c => c.addEventListener('click', () => showToast(`附件预览：${c.dataset.openAttachment}`, 'file-text')));

      const resizer = document.getElementById('space-resizer');
      const wrap = document.getElementById('space-split-wrap');
      const listPane = document.getElementById('space-list-pane');
      if (resizer && wrap && listPane) {
        resizer.addEventListener('pointerdown', () => {
          resizer.classList.add('dragging');
          const onMove = ev => {
            const rect = wrap.getBoundingClientRect();
            const pct = Math.min(48, Math.max(20, ((ev.clientX - rect.left) / rect.width) * 100));
            state.spaceSplitPercent = pct;
            listPane.style.width = pct + '%';
          };
          const onUp = () => { resizer.classList.remove('dragging'); window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      }
    }

    // =========================================================================
    // VIEW 1: SEARCH & ALL CONTENT (Dual-Mode + Subpage Collapse + 1/N Jump)
    // =========================================================================

    function getFilteredDocs() {
      const q = state.searchQuery.trim().toLowerCase();
      return DOCUMENTS.filter(doc => {
        if (!state.selectedLibraries.has(doc.library)) return false;
        if (state.searchTag && !doc.tags.includes(state.searchTag)) return false;
        if (state.searchDate === '7d' && doc.dateBucket !== '7d') return false;
        if (!q) return true;
        const selfMatch = doc.title.toLowerCase().includes(q) || doc.snippet.toLowerCase().includes(q) || doc.tags.some(t => t.toLowerCase().includes(q)) || getDocPlainText(doc).toLowerCase().includes(q);
        const subMatch = (doc.subpages || []).some(sp => sp.title.toLowerCase().includes(q) || sp.snippet.toLowerCase().includes(q) || getDocPlainText(sp).toLowerCase().includes(q));
        return selfMatch || subMatch;
      });
    }

    function jumpToInDocHit(delta, totalHits) {
      if (!totalHits) return;
      state.inDocHitIndex = (state.inDocHitIndex + delta + totalHits) % totalHits;
      renderMain();
      requestAnimationFrame(() => {
        const mark = document.querySelector(`mark.search-hit[data-hit-idx="${state.inDocHitIndex}"]`);
        if (mark) mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }

    function renderSearchView(stage) {
      const q = state.searchQuery.trim();
      const effectiveMode = state.searchDensity === 'auto' ? (q || state.searchTag ? 'snippet' : 'compact') : state.searchDensity;
      const filtered = getFilteredDocs();

      if (!state.previewPinned && filtered.length && !filtered.some(d => d.id === state.selectedDocId)) {
        state.selectedDocId = filtered[0].id;
        state.activeSubpageId = null;
        state.inDocHitIndex = 0;
      }

      const activeDoc = getDoc(state.selectedDocId);
      const sub = state.activeSubpageId && activeDoc.subpages ? activeDoc.subpages.find(s => s.id === state.activeSubpageId) : null;
      const readingTarget = sub || activeDoc;
      const isSubpage = Boolean(sub);
      const activeLib = getLib(activeDoc.library);
      const totalHits = q ? countQueryHitsInTarget(readingTarget, q) : 0;
      if (totalHits > 0 && state.inDocHitIndex >= totalHits) state.inDocHitIndex = 0;
      const hitCounter = { count: 0 };

      const grouped = ['今天', '昨天', '本周', '上月']
        .map(g => ({ label: g, items: filtered.filter(d => d.timeGroup === g) }))

        <div class="flex flex-col h-full animate-view">

              <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg" style="background:var(--bg-subtle); border:0.5px solid ${state.searchFocused ? 'var(--accent)' : 'var(--hairline)'}">
                <i data-lucide="search" class="w-3.5 h-3.5 shrink-0" style="color:${state.searchFocused ? 'var(--accent)' : 'var(--ink-tertiary)'}"></i>
                <input id="search-view-input" type="text" value="${escapeHtml(state.searchQuery)}" placeholder="搜索全部资料库（试试输入“线束”体验子页面折叠与 1/N 跳转）..." class="w-full bg-transparent outline-none text-[13px]" autocomplete="off" />
                ${q ? `<button id="btn-clear-search" class="text-[11px] px-1.5 py-0.5 rounded cursor-pointer hover:bg-black/5" style="color:var(--ink-tertiary)">清除</button>` : `<kbd class="font-mono-eng text-[10px] px-1.5 py-0.5 rounded hidden sm:inline" style="background:var(--bg-paper); border:0.5px solid var(--hairline); color:var(--ink-tertiary)">⌘K</kbd>`}
              </div>
              ${state.searchFocused && !q ? `
                <div class="absolute left-0 right-0 top-full mt-1.5 rounded-xl p-2.5 z-30 animate-view" style="background:var(--bg-paper); border:0.5px solid var(--hairline-strong); box-shadow:var(--modal-shadow)">
                  <div class="mb-2">
                    <div class="px-2 py-1 text-[10.5px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">最近搜索</div>
                    <div class="flex flex-wrap gap-1.5 px-2 pt-1">${state.recentQueries.map(rq => `<button class="pill-btn text-[11.5px]" data-recent-query="${escapeHtml(rq)}"><i data-lucide="history" class="w-3 h-3"></i> ${escapeHtml(rq)}</button>`).join('')}</div>
                  </div>
                  <div class="pt-2 hairline-t">
                    <div class="px-2 py-1 text-[10.5px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">最近打开</div>
                    <div class="space-y-0.5 mt-0.5">${state.recentDocIds.map(id => { const rd = getDoc(id); return `<button class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left text-[12.5px] hover:bg-black/5 cursor-pointer" data-recent-doc="${rd.id}"><span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${getLib(rd.library).color}"></span><span class="truncate flex-1 font-medium">${escapeHtml(rd.title)}</span><span class="font-mono-eng text-[10.5px]" style="color:var(--ink-tertiary)">${getLib(rd.library).short}</span></button>`; }).join('')}</div>
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto">
              <button class="pill-btn ${state.searchDate === 'all' ? 'active' : ''}" data-date-filter="all">全部时间</button>
              <button class="pill-btn ${state.searchDate === '7d' ? 'active' : ''}" data-date-filter="7d">近 7 天</button>
              ${state.searchTag ? `<button id="btn-clear-tag" class="pill-btn active">#${state.searchTag} <i data-lucide="x" class="w-3 h-3"></i></button>` : ''}
              <div class="inline-flex items-center p-0.5 rounded-full" style="background:var(--bg-subtle)">
                <button class="px-2 py-0.5 rounded-full text-[11px] cursor-pointer ${effectiveMode === 'compact' ? 'font-medium' : ''}" data-density="compact" style="background:${effectiveMode === 'compact' ? 'var(--bg-paper)' : 'transparent'}">紧凑</button>
                <button class="px-2 py-0.5 rounded-full text-[11px] cursor-pointer ${effectiveMode === 'snippet' ? 'font-medium' : ''}" data-density="snippet" style="background:${effectiveMode === 'snippet' ? 'var(--bg-paper)' : 'transparent'}">摘要</button>
              </div>
              <span class="font-mono-eng text-[11px] ml-1 whitespace-nowrap" style="color:var(--ink-tertiary)">${q ? `${filtered.length} 篇 · 9ms` : `${filtered.length} 篇`}</span>
            </div>
          </div>

          <div id="search-split-wrap" class="flex-1 flex min-h-0 overflow-hidden">
            <div id="search-list-pane" class="overflow-y-auto p-4 shrink-0" style="width:${state.splitPercent}%; min-width:260px; max-width:60%">
              ${filtered.length === 0 ? `
                <div class="paper-sheet p-8 text-center space-y-2"><div class="text-[13.5px] font-medium">没有匹配的条目</div><button id="btn-expand-all-libs" class="primary-btn px-3.5 py-1.5 text-[12px]">扩大到全部资料库</button></div>

                <div class="space-y-4">
                  ${grouped.map(grp => `
                    <div>
                      <div class="px-2 pb-1.5 flex items-center justify-between text-[11px] font-medium" style="color:var(--ink-tertiary)"><span>${grp.label}</span><span class="font-mono-eng">${grp.items.length}</span></div>

                        ${grp.items.map(doc => {
                          const lib = getLib(doc.library);
                          const isSel = doc.id === state.selectedDocId && !state.activeSubpageId;
                          return `<div class="inset-row px-3 py-2 flex items-center gap-2.5 cursor-pointer ${isSel ? 'selected' : ''}" data-doc-id="${doc.id}"><span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${lib.color}"></span><span class="text-[13px] font-medium truncate">${escapeHtml(doc.title)}</span><span class="text-[11.5px] truncate hidden sm:inline shrink" style="color:var(--ink-tertiary)">— ${escapeHtml(doc.path)}</span><span class="ml-auto font-mono-eng text-[10.5px] shrink-0" style="color:var(--ink-tertiary)">${doc.relTime}</span></div>`;
                        }).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="inset-group">
                  ${filtered.map(doc => {
                    const lib = getLib(doc.library);
                    const isSel = doc.id === state.selectedDocId && !state.activeSubpageId;
                    const matchedSubs = (doc.subpages || []).filter(sp => !q || sp.title.toLowerCase().includes(q.toLowerCase()) || sp.snippet.toLowerCase().includes(q.toLowerCase()) || getDocPlainText(sp).toLowerCase().includes(q.toLowerCase()));
                    const subsExpanded = state.expandedSubpages.has(doc.id);
                    const docHits = q ? countQueryHitsInTarget(doc, q) : 0;
                    return `
                      <div class="inset-row px-3.5 py-3 cursor-pointer ${isSel ? 'selected' : ''}" data-doc-id="${doc.id}">
                        <div class="flex items-center justify-between gap-2 mb-1">
                          <span class="inline-flex items-center gap-1.5 text-[11px] font-medium" style="color:var(--ink-secondary)"><span class="w-1.5 h-1.5 rounded-full" style="background:${lib.color}"></span>${lib.short}${docHits > 0 ? `<span class="font-mono-eng text-[10px] px-1.5 py-0.5 rounded" style="background:var(--bg-subtle); color:var(--ink-tertiary)">${docHits} 处命中</span>` : ''}</span>
                          <span class="font-mono-eng text-[10.5px]" style="color:var(--ink-tertiary)">${doc.updated}</span>
                        </div>
                        <div class="text-[13.5px] font-medium leading-snug mb-1">${highlightSnippet(doc.title, q)}</div>
                        <div class="text-[12px] line-clamp-2 leading-relaxed" style="color:var(--ink-secondary)">${highlightSnippet(doc.snippet, q)}</div>
                        ${matchedSubs.length > 0 ? `
                          <div class="mt-2.5 pt-2 hairline-t">
                            <button class="inline-flex items-center gap-1 text-[11.5px] font-medium cursor-pointer hover:underline" style="color:var(--accent)" data-toggle-subs="${doc.id}"><i data-lucide="${subsExpanded ? 'chevron-down' : 'chevron-right'}" class="w-3.5 h-3.5"></i><span>${subsExpanded ? `收起 ${matchedSubs.length} 篇关联子页面` : `展开其余 ${matchedSubs.length} 项子页面`}</span></button>
                            ${subsExpanded ? `<div class="mt-2 pl-3 space-y-1.5" style="border-left:1.5px solid var(--hairline-strong)">${matchedSubs.map(sp => { const subSel = state.selectedDocId === doc.id && state.activeSubpageId === sp.id; return `<div class="px-2.5 py-1.5 rounded-lg cursor-pointer" data-sub-parent="${doc.id}" data-sub-id="${sp.id}" style="background:${subSel ? 'var(--bg-active)' : 'var(--bg-surface)'}"><div class="text-[12.5px] font-medium truncate" style="color:${subSel ? 'var(--accent)' : 'var(--ink-primary)'}">${highlightSnippet(sp.title, q)}</div><div class="text-[11.5px] line-clamp-1 mt-0.5" style="color:var(--ink-secondary)">${highlightSnippet(sp.snippet, q)}</div></div>`; }).join('')}</div>` : ''}
                          </div>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <div id="search-resizer" class="split-resizer"></div>

            <div class="flex-1 min-w-0 overflow-y-auto p-5 lg:p-7 pb-16 select-text">
              <article class="paper-sheet p-6 lg:p-9 mx-auto max-w-[780px]">
                <div class="flex items-center justify-between gap-2 pb-3.5 mb-5 hairline-b sticky top-0 z-10 -mx-2 px-2 py-1.5 rounded-lg" style="background:rgba(255,255,255,0.92); backdrop-filter:blur(12px)">
                  <div class="flex items-center gap-1.5 min-w-0 text-[12px]">
                    <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${activeLib.color}"></span>
                    ${isSubpage ? `<button id="btn-back-parent-doc" class="hover:underline cursor-pointer truncate font-medium" style="color:var(--accent)">${escapeHtml(activeDoc.title)}</button><span style="color:var(--ink-muted)">/</span><span class="truncate font-medium">${escapeHtml(readingTarget.title)}</span>` : `<span class="font-medium truncate" style="color:var(--ink-secondary)">${escapeHtml(activeDoc.path)}</span>`}
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    ${totalHits > 0 ? `<div class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-lg mr-1" style="background:var(--bg-subtle); border:0.5px solid var(--hairline)"><span class="font-mono-eng text-[11px] px-1" style="color:var(--ink-secondary)">${state.inDocHitIndex + 1}/${totalHits}</span><button id="btn-hit-prev" class="icon-btn !w-5 !h-5"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button><button id="btn-hit-next" class="icon-btn !w-5 !h-5"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button></div>` : ''}
                    ${(readingTarget.spaceNodeId || activeDoc.spaceNodeId) ? `<button id="btn-open-in-space" class="pill-btn text-[11.5px]" title="在资料库层级中打开或并排对照"><i data-lucide="columns-2" class="w-3 h-3"></i> 空间/并排</button>` : ''}
                    <button id="btn-pin-preview" class="icon-btn ${state.previewPinned ? 'active' : ''}" title="${state.previewPinned ? '取消固定阅读面板' : '固定当前文档'}">
                      <i data-lucide="pin" class="w-3.5 h-3.5"></i>
                    </button>
                    <button id="btn-fav-doc" class="icon-btn ${activeDoc.favorite ? 'active' : ''}" title="收藏文档">
                      <i data-lucide="star" class="w-3.5 h-3.5"></i>
                    </button>
                    <button id="btn-ask-quick-doc" class="pill-btn text-[11.5px]"><i data-lucide="sparkles" class="w-3 h-3" style="color:var(--accent)"></i> 问助手</button>
                  </div>
                </div>

                <h1 class="text-[21px] font-semibold tracking-tight leading-snug mb-2.5 ${state.serifReading ? 'font-reading-serif' : ''}">${highlightRichText(readingTarget.title, q, hitCounter)}</h1>
                <div class="flex flex-wrap items-center gap-2 mb-5 text-[11.5px]" style="color:var(--ink-tertiary)">
                  <span class="font-mono-eng">更新于 ${readingTarget.updated || activeDoc.updated}</span>
                  <span>·</span>
                  ${(activeDoc.tags || []).map(t => `<span class="px-2 py-0.5 rounded-full font-mono-eng" style="background:var(--bg-subtle); color:var(--ink-secondary)">#${t}</span>`).join('')}
                </div>

                <div class="reading-prose text-[14.5px] ${state.serifReading ? 'font-reading-serif' : ''}">${renderDocumentBlocks(readingTarget, q, hitCounter)}</div>

                <div class="mt-8 pt-5 hairline-t flex flex-wrap items-center justify-between gap-3">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-[11.5px] font-medium" style="color:var(--ink-tertiary)">反向链接</span>
                    ${(activeDoc.backlinks && activeDoc.backlinks.length) ? activeDoc.backlinks.map(b => `<span class="text-[11.5px] px-2 py-0.5 rounded-md" style="background:var(--bg-subtle); color:var(--ink-secondary)">[[${escapeHtml(b)}]]</span>`).join('') : `<span class="text-[11.5px]" style="color:var(--ink-muted)">暂无反向链接</span>`}
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button id="btn-doc-to-task" class="pill-btn text-[11.5px]"><i data-lucide="list-plus" class="w-3 h-3"></i> 转为任务</button>
                    <button id="btn-doc-to-card" class="pill-btn text-[11.5px]"><i data-lucide="layers" class="w-3 h-3"></i> 生成闪卡</button>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </div>
      `;

      const searchInput = document.getElementById('search-view-input');
      searchInput.addEventListener('focus', () => { if (!state.searchFocused) { state.searchFocused = true; renderMain(); document.getElementById('search-view-input')?.focus(); } });
      searchInput.addEventListener('blur', () => { setTimeout(() => { if (state.searchFocused && document.activeElement?.id !== 'search-view-input') { state.searchFocused = false; renderMain(); } }, 160); });
      searchInput.addEventListener('input', e => { state.searchQuery = e.target.value; state.inDocHitIndex = 0; const pos = searchInput.selectionStart; renderMain(); const ni = document.getElementById('search-view-input'); if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); } });
      searchInput.addEventListener('keydown', e => { if (e.key === 'Enter' && totalHits > 0) { e.preventDefault(); jumpToInDocHit(e.shiftKey ? -1 : 1, totalHits); } });

      document.getElementById('btn-clear-search')?.addEventListener('click', () => { state.searchQuery = ''; state.inDocHitIndex = 0; renderMain(); });
      document.getElementById('btn-clear-tag')?.addEventListener('click', () => { state.searchTag = null; renderAll(); });
      document.getElementById('btn-expand-all-libs')?.addEventListener('click', () => { state.selectedLibraries = new Set(LIBRARIES.map(l => l.id)); renderAll(); });
      stage.querySelectorAll('[data-recent-query]').forEach(b => b.addEventListener('mousedown', e => { e.preventDefault(); state.searchQuery = b.dataset.recentQuery; state.searchFocused = false; renderMain(); }));
      stage.querySelectorAll('[data-recent-doc]').forEach(b => b.addEventListener('mousedown', e => { e.preventDefault(); state.selectedDocId = b.dataset.recentDoc; state.activeSubpageId = null; state.searchFocused = false; renderMain(); }));
      stage.querySelectorAll('[data-density]').forEach(b => b.addEventListener('click', () => { state.searchDensity = b.dataset.density; renderMain(); }));
      stage.querySelectorAll('[data-date-filter]').forEach(b => b.addEventListener('click', () => { state.searchDate = b.dataset.dateFilter; renderMain(); }));
      stage.querySelectorAll('[data-toggle-subs]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const id = b.dataset.toggleSubs; state.expandedSubpages.has(id) ? state.expandedSubpages.delete(id) : state.expandedSubpages.add(id); renderMain(); }));
      stage.querySelectorAll('[data-sub-id]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); state.selectedDocId = el.dataset.subParent; state.activeSubpageId = el.dataset.subId; state.inDocHitIndex = 0; renderMain(); }));
      stage.querySelectorAll('[data-doc-id]').forEach(r => r.addEventListener('click', () => { state.selectedDocId = r.dataset.docId; state.activeSubpageId = null; state.inDocHitIndex = 0; renderMain(); }));
      document.getElementById('btn-back-parent-doc')?.addEventListener('click', () => { state.activeSubpageId = null; renderMain(); });
      document.getElementById('btn-hit-prev')?.addEventListener('click', () => jumpToInDocHit(-1, totalHits));
      document.getElementById('btn-hit-next')?.addEventListener('click', () => jumpToInDocHit(1, totalHits));
      document.getElementById('btn-open-in-space')?.addEventListener('click', () => openPaperInSpace(readingTarget.spaceNodeId || activeDoc.spaceNodeId, false));

          if (ctx2) activeCharts.push(new Chart(ctx2, { type: 'doughnut', data: { labels: LIBRARIES.map(l => l.short), datasets: [{ data: LIBRARIES.map(l => l.count), backgroundColor: LIBRARIES.map(l => l.color), borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '64%', plugins: { legend: { position: 'bottom' } } } }));

    function getPaletteItems() {
      const q = state.paletteQuery.trim().toLowerCase();
      const cmds = [
        { type: '双纸对照', title: '并排摊开：Craft《1 线束》 × Obsidian《试装现场记录》', icon: 'columns-2', run: () => { state.view = 'space'; state.spaceSurface = 'dual'; state.readerPapers = ['c-doc-1', 'o-field']; renderAll(); } },
        ...LIBRARIES.filter(l => l.browsable).map(l => ({ type: '资料库层级', title: `打开 ${l.name} 层级结构`, icon: 'folder-tree', run: () => { state.view = 'space'; state.spaceLib = l.id; state.spaceFolderId = 'root-' + l.id; state.spaceSurface = 'split'; renderAll(); } })),
        ...NAV_ITEMS.map(n => ({ type: '工作区', title: `前往 ${n.label}`, icon: n.icon, run: () => { state.view = n.id; renderAll(); } })),
        ...SPACE_NODES.filter(n => n.kind !== 'folder').map(n => ({ type: getLib(n.lib).short, title: n.title, icon: 'file-text', run: () => openPaperInSpace(n.id, false) }))
      ];
      return !q ? cmds.slice(0, 10) : cmds.filter(c => c.title.toLowerCase().includes(q) || c.type.toLowerCase().includes(q));

    function renderPalette() {
      const modal = document.getElementById('modal-palette');
      if (!state.paletteOpen) { modal.classList.add('hidden'); modal.classList.remove('flex'); return; }
      modal.classList.remove('hidden'); modal.classList.add('flex');
      const items = getPaletteItems();
      if (state.paletteIndex >= items.length) state.paletteIndex = 0;
      const list = document.getElementById('palette-results');
      list.innerHTML = items.map((item, idx) => `
        <button class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left cursor-pointer" data-pal-idx="${idx}" style="background:${idx === state.paletteIndex ? 'var(--bg-active)' : 'transparent'}">
          <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0" style="color:${idx === state.paletteIndex ? 'var(--accent)' : 'var(--ink-tertiary)'}"></i>

      `).join('');

        <div class="space-y-3">
          <div class="text-[12px] font-semibold uppercase tracking-wider" style="color:var(--ink-tertiary)">MCP 与云端连接</div>
          <div class="inset-group">
            ${state.mcpServers.map(s => `<div class="inset-row px-4 py-3 flex items-center justify-between gap-3"><div><div class="text-[13px] font-medium">${escapeHtml(s.name)}</div><div class="font-mono-eng text-[11px]" style="color:var(--ink-tertiary)">${escapeHtml(s.endpoint)} · ${s.latency}</div></div><button class="pill-btn ${s.enabled ? 'active' : ''}" data-toggle-mcp="${s.id}">${s.enabled ? '已启用' : '已停用'}</button></div>`).join('')}

      body.querySelectorAll('[data-toggle-mcp]').forEach(b => b.addEventListener('click', () => { const t = state.mcpServers.find(x => x.id === b.dataset.toggleMcp); if (t) { t.enabled = !t.enabled; openSettingsModal(); } }));
