    // =========================================================================
    // MASTER RENDER & GLOBAL EVENTS
    // =========================================================================

    function renderMain() {
      destroyCharts();
      syncHashFromView();
      const stage = document.getElementById('main-stage');
      const embedStage = document.getElementById('embed-stage');

      if (isEmbedActive(state.view)) {
        stage.classList.add('hidden');
        embedStage.classList.remove('hidden');
        ensureEmbedFrame(state.view);
        Object.keys(mountedEmbeds).forEach(k => {
          mountedEmbeds[k].classList.toggle('active', k === state.view);
        });
      } else {
        embedStage.classList.add('hidden');
        stage.classList.remove('hidden');
        if (state.view === 'space') renderSpaceView(stage);
        else if (state.view === 'search') renderSearchView(stage);
        else if (state.view === 'agents') renderAgentsView(stage);
        else if (state.view === 'reading') renderReadingView(stage);
        else if (state.view === 'tasks') renderTasksView(stage);
        else if (state.view === 'journals') renderJournalsView(stage);
        else if (state.view === 'flashcards') renderFlashcardsView(stage);
        else if (state.view === 'insights') renderInsightsView(stage);
      }
      renderQuickAssistant();
      safeIcons();
    }

    function renderAll() { renderChrome(); renderMain(); renderStatusBar(); }

    window.addEventListener('click', () => {
      if (state.jumpBarOpenKey) {
        state.jumpBarOpenKey = null;
        renderMain();
      }
    });

    document.getElementById('btn-toggle-sidebar').addEventListener('click', () => { state.sidebarCollapsed = !state.sidebarCollapsed; renderChrome(); });
    document.getElementById('btn-toggle-libs').addEventListener('click', () => { state.libsCollapsed = !state.libsCollapsed; renderChrome(); });
    document.getElementById('btn-reset-libs').addEventListener('click', () => { state.selectedLibraries = new Set(LIBRARIES.map(l => l.id)); showToast('已恢复全部 6 个资料库'); renderAll(); });
    document.getElementById('btn-toggle-serif').addEventListener('click', () => { state.serifReading = !state.serifReading; renderAll(); });
    document.getElementById('btn-sync-now').addEventListener('click', () => { const l = document.getElementById('sync-label'); l.textContent = '同步中...'; setTimeout(() => { l.textContent = 'SQLite · 3,223'; showToast('增量同步完成 (9ms)', 'refresh-cw'); }, 400); });
    document.getElementById('btn-open-palette').addEventListener('click', () => { state.paletteOpen = true; state.paletteQuery = ''; renderPalette(); const i = document.getElementById('palette-input'); i.value = ''; i.focus(); });
    document.getElementById('modal-palette').addEventListener('click', e => { if (e.target.id === 'modal-palette') { state.paletteOpen = false; renderPalette(); } });
    document.getElementById('palette-input').addEventListener('input', e => { state.paletteQuery = e.target.value; state.paletteIndex = 0; renderPalette(); });
    document.getElementById('palette-input').addEventListener('keydown', e => {
      const items = getPaletteItems();
      if (e.key === 'ArrowDown') { e.preventDefault(); state.paletteIndex = (state.paletteIndex + 1) % Math.max(1, items.length); renderPalette(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); state.paletteIndex = (state.paletteIndex - 1 + Math.max(1, items.length)) % Math.max(1, items.length); renderPalette(); }
      else if (e.key === 'Enter' && items[state.paletteIndex]) { e.preventDefault(); state.paletteOpen = false; renderPalette(); items[state.paletteIndex].run(); }
    });
    document.getElementById('btn-open-settings').addEventListener('click', openSettingsModal);
    document.getElementById('btn-close-settings').addEventListener('click', () => { const m = document.getElementById('modal-settings'); m.classList.add('hidden'); m.classList.remove('flex'); });
    document.getElementById('modal-settings').addEventListener('click', e => { if (e.target.id === 'modal-settings') { e.target.classList.add('hidden'); e.target.classList.remove('flex'); } });
    document.getElementById('btn-quick-assistant').addEventListener('click', toggleQuickAssistant);
    document.getElementById('btn-status-assistant').addEventListener('click', toggleQuickAssistant);
    document.getElementById('btn-close-agent-source').addEventListener('click', () => {
      agentSource.hidden = true;
      renderQuickAssistant();
      postQuickAssistant('focus');
    });
    agentDemoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setAgentDemoPopover(agentDemoPopover.hidden);
    });
    document.addEventListener('click', (e) => {
      if (!agentDemoPopover.hidden && !document.getElementById('quick-assistant-controls').contains(e.target)) {
        setAgentDemoPopover(false);
      }
    });
    assistantCases.forEach(button => button.addEventListener('click', () => {
      agentSource.hidden = true;
      setAgentDemoPopover(false);
      syncAgentDemoTrigger(button.dataset.agentCase);
      openQuickAssistant({ type: 'case', value: button.dataset.agentCase });
    }));
    document.getElementById('btn-cancel-card-edit').addEventListener('click', closeCardEditModal);
    document.getElementById('btn-save-card-edit').addEventListener('click', () => {
      const c = state.flashcards.find(x => x.id === state.editingCardId);
      if (c) { c.deck = document.getElementById('edit-card-deck').value.trim() || c.deck; c.front = document.getElementById('edit-card-front').value.trim() || c.front; c.back = document.getElementById('edit-card-back').value.trim() || c.back; }
      closeCardEditModal(); renderMain();
    });

    // Global Keyboard Flow
    window.addEventListener('keydown', e => {
      const tag = (e.target && e.target.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); state.paletteOpen = !state.paletteOpen; renderPalette();
        if (state.paletteOpen) { const i = document.getElementById('palette-input'); i.value = ''; i.focus(); }
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); state.sidebarCollapsed = !state.sidebarCollapsed; renderChrome(); return; }
      if ((e.metaKey || e.ctrlKey) && e.key === '.' && state.view === 'space' && state.spaceSurface === 'split') {
        e.preventDefault();
        state.spaceFocusReader = !state.spaceFocusReader;
        renderMain();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); toggleQuickAssistant(); return; }
      if ((e.metaKey || e.ctrlKey) && e.key >= '1' && e.key <= '7') {
        e.preventDefault();
        const n = NAV_ITEMS[Number(e.key) - 1];
        if (n) { state.view = n.id; renderAll(); }
        return;
      }
      if (e.key === 'Escape') {
        if (!agentDemoPopover.hidden) { setAgentDemoPopover(false); return; }
        state.paletteOpen = false; state.jumpBarOpenKey = null;
        closeQuickAssistant();
        renderPalette(); renderQuickAssistant(); closeCardEditModal();
        document.getElementById('modal-settings').classList.add('hidden');
        renderMain();
        return;
      }

      if (typing) return;

      if (state.view === 'space' && state.spaceSurface === 'split') {
        const items = getVisibleHierarchyList();
        if (!items.length) return;
        const curIdx = Math.max(0, items.findIndex(i => i.node.id === state.spaceSelectedCardId));
        const curNode = items[curIdx]?.node;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          state.spaceSelectedCardId = items[(curIdx + 1) % items.length].node.id;
          renderAll();
          requestAnimationFrame(() => document.querySelector(`[data-space-row="${state.spaceSelectedCardId}"]`)?.scrollIntoView({ block: 'nearest' }));
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          state.spaceSelectedCardId = items[(curIdx - 1 + items.length) % items.length].node.id;
          renderAll();
          requestAnimationFrame(() => document.querySelector(`[data-space-row="${state.spaceSelectedCardId}"]`)?.scrollIntoView({ block: 'nearest' }));
          return;
        }
        if (e.key === 'ArrowRight' && curNode && getSpaceChildren(curNode.id).length > 0) {
          e.preventDefault();
          state.spaceExpandedIds.add(curNode.id);
          renderMain();
          return;
        }
        if (e.key === 'ArrowLeft' && curNode) {
          e.preventDefault();
          if (state.spaceExpandedIds.has(curNode.id)) {
            state.spaceExpandedIds.delete(curNode.id);
            renderMain();
          } else if (getSpaceNode(curNode.parent)) {
            state.spaceSelectedCardId = curNode.parent;
            renderAll();
            requestAnimationFrame(() => document.querySelector(`[data-space-row="${state.spaceSelectedCardId}"]`)?.scrollIntoView({ block: 'nearest' }));
          }
          return;
        }
        if (e.key === 'Enter' && curNode) {
          e.preventDefault();
          if (curNode.kind === 'folder') {
            state.spaceExpandedIds.add(curNode.id);
            renderMain();
          } else {
            state.spaceFocusReader = !state.spaceFocusReader;
            renderMain();
          }
          return;
        }
      }

      if (state.view === 'flashcards') {
        if (e.code === 'Space') { e.preventDefault(); state.cardFlipped = !state.cardFlipped; renderMain(); }
        else if (state.cardFlipped && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); rateCurrentCard({ '1': 'again', '2': 'hard', '3': 'good', '4': 'easy' }[e.key]); }
      }
    });

    // Pro vs v3 mode switcher
    document.getElementById('btn-mode-pro').addEventListener('click', () => {
      if (!EMBED_MODULES[state.view]) return;
      proModuleMode[state.view] = true;
      renderAll();
      showToast('已切换至高保真专题原型');
    });
    document.getElementById('btn-mode-v3').addEventListener('click', () => {
      if (!EMBED_MODULES[state.view]) return;
      proModuleMode[state.view] = false;
      renderAll();
      showToast('已切换至 v3 轻量内置视图');
    });

    // Receive forwarded global shortcuts from embedded high-fidelity modules
    window.addEventListener('message', (ev) => {
      const data = ev && ev.data;
      if (!data || typeof data !== 'object') return;
      if (ev.source === quickAssistantFrame.contentWindow) {
        receiveQuickAssistant(data);
      }
      if (data.type !== 'hub-shortcut') return;
      const knownFrame = [quickAssistantFrame, ...Object.values(mountedEmbeds)].some(frame => ev.source === frame.contentWindow);
      if (!knownFrame) return;
      const k = String(data.key || '').toLowerCase();
      if (k === 'k') {
        state.paletteOpen = !state.paletteOpen;
        renderPalette();
        if (state.paletteOpen) { const i = document.getElementById('palette-input'); i.value = ''; i.focus(); }
      } else if (k === '\\') {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        renderChrome();
      } else if (k === 'j') {
        toggleQuickAssistant();
      } else if (data.key >= '1' && data.key <= '7') {
        const n = NAV_ITEMS[Number(data.key) - 1];
        if (n) { state.view = n.id; renderAll(); }
      }
    });

    // Support URL hash deep-linking (#space, #search, #agents, #reading, #tasks, #journals, #flashcards, #insights)
    function applyHashView() {
      const h = (window.location.hash || '').replace(/^#/, '').trim();
      const valid = ['space', 'search', 'agents', 'reading', 'tasks', 'journals', 'flashcards', 'insights'];
      if (valid.includes(h)) state.view = h;
    }
    window.addEventListener('hashchange', () => { applyHashView(); renderAll(); });
    applyHashView();

    // Boot cleanly
    renderAll();
  </script>
</body>
</html>
